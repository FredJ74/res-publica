name: "PNJ Starovka — identité bouriate"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '27 3 * * *'
  pull_request:
    paths:
      - "api/_pnj-culture-bouriate.js"
      - "api/_pnj-profils.js"
      - "api/_reaction-habitant.js"
      - "outils/bancs/test-starovka-bouriates-20261117.cjs"
      - ".github/workflows/pnj-starovka-bouriates.yml"
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - "api/_pnj-culture-bouriate.js"
      - "api/_pnj-profils.js"
      - "api/_reaction-habitant.js"
      - "outils/bancs/test-starovka-bouriates-20261117.cjs"
      - ".github/workflows/pnj-starovka-bouriates.yml"
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check api/_pnj-culture-bouriate.js
      - run: node --check api/_pnj-profils.js
      - run: node --check api/_reaction-habitant.js
      - run: node outils/bancs/test-starovka-bouriates-20261117.cjs
