name: Novomirsk - cinq nouveaux decors WebP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/novomirsk-cinq-decors-20261108.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir les cinq originaux et retirer les PNG
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          dossier = Path('images/Sovarka/Novomirsk')
          originaux = {
            'Novomirsk_agence presse_hall.png': 'Novomirsk_presse_accueil.webp',
            'Novomirsk_marchande poisson.png': 'Novomirsk_poissonniere.webp',
            'Novomirsk_marché.png': 'Novomirsk_marche.webp',
            'Novomirsk_pharmacie_accueil.png': 'Novomirsk_pharmacie.webp',
            'Novomirsk_salon coiffure.png': 'Novomirsk_salon_coiffure.webp'
          }
          js = Path('data.js').read_text(encoding='utf8')
          for old, new in originaux.items():
              src,dst=dossier/old,dossier/new
              assert src.exists(), f'PNG introuvable: {src}'
              assert not dst.exists(), f'Destination existante: {dst}'
              assert js.count(str(dst)) == 1, f'Raccordement incorrect: {dst}'
          for old, new in originaux.items():
              src,dst=dossier/old,dossier/new
              with Image.open(src) as image:
                  assert image.width >= 1200 and image.height >= 650, f'Dimensions anormales: {src}'
                  image.convert('RGB').save(dst,'WEBP',quality=93,method=6)
              with Image.open(dst) as image:
                  assert image.format == 'WEBP' and image.width >= 1200
                  print(dst, image.size, dst.stat().st_size)
              src.unlink()
          assert all((dossier/new).exists() and not (dossier/old).exists() for old,new in originaux.items())
          PY
      - name: Verifier les liaisons et le code
        run: |
          node --check data.js
          python - <<'PY'
          from pathlib import Path
          code = Path('data.js').read_text(encoding='utf8')
          debut = code.index("name:'Novomirsk'")
          fin = code.index('    ville_a:',debut)
          ville = code[debut:fin]
          for bat,piece,nom in [
            ("'la-tribune': {","accueil_tribune","Novomirsk_presse_accueil.webp"),
            ("'marche': {","marche_ext","Novomirsk_marche.webp"),
            ("'salon-coiffure-novomirsk': {","salon_coiffure","Novomirsk_salon_coiffure.webp"),
            ("'pharmacie-officielle-novomirsk': {","comptoir_pharmacie","Novomirsk_pharmacie.webp"),
            ("'poissonniere-novomirsk': {","etal_poissonniere","Novomirsk_poissonniere.webp")
          ]:
              assert bat in ville, bat
              assert piece in ville, piece
              assert ville.count(nom) == 1, nom
          PY
          git diff --check
      - name: Commit fichiers WebP et suppressions
        run: |
          git add -A images/Sovarka/Novomirsk
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Novomirsk : cinq decors convertis WebP et PNG supprimes'
            git push
          fi
