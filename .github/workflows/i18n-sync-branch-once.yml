name: Brouillon i18n — réconcilier main sans publication (éphémère)
on:
  push:
    branches:
      - chatgpt/accueil-9-langues-20261102
    paths:
      - '.github/workflows/i18n-sync-branch-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/accueil-9-langues-20261102
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fusionner la branche principale dans le brouillon seulement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD
          node --check data.js
          node --check i18n/orders-resources.js
          node --test outils/bancs/banc-i18n-catalogue-ordres.cjs outils/bancs/banc-i18n-etat-ordres.cjs outils/bancs/banc-i18n-salles-gouvernement.cjs outils/bancs/banc-i18n-plateau-init.cjs
          git grep -q 'sovarka_signalements' -- data.js
          git grep -q 'sovarka_signalements' -- i18n/orders-resources.js
          git rm .github/workflows/i18n-sync-branch-once.yml
          git commit -m "Retirer synchronisation temporaire du brouillon i18n"
          git push origin HEAD:chatgpt/accueil-9-langues-20261102
