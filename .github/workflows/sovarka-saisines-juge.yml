name: Sovarka — accès aux saisines du ministre
on:
  pull_request:
    paths:
      - 'data.js'
      - 'outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs'
      - '.github/workflows/sovarka-saisines-juge.yml'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check data.js
      - run: node --test outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs
