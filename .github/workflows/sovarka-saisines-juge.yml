name: Sovarka — accès aux saisines du ministre
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '47 3 * * *'
  pull_request:
    paths:
      - 'data.js'
      - 'outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs'
      - '.github/workflows/sovarka-saisines-juge.yml'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check data.js
      - run: node --test outils/bancs/banc-saisines-ministre-juge-sovarka-20261113.cjs
