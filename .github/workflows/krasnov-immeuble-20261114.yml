name: Krasnov immeuble — convertir et tester
on:
  push:
    branches: [feat/krasnov-immeuble-centre-commercial-20261114]
    paths:
      - 'data.js'
      - 'plateau-rue-centrale.js'
      - 'migrations/20261114183000_krasnov_immeuble_commercial.sql'
      - 'outils/bancs/test-krasnov-immeuble-commercial-20261114.mjs'
      - '.github/workflows/krasnov-immeuble-20261114.yml'
permissions:
  contents: write
jobs:
  conversion-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir les trois images originales
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('images/Sovarka/Krasnov')
          src=sorted(d.glob('Image ChatGPT 14 nov. 2026, 17_44_*.png'))
          assert len(src)==3, f'3 sources requises: {src}'
          noms=['Krasnov_immeuble_commercial_hall.webp',
                'Krasnov_immeuble_commercial_appartement_1_chambre.webp',
                'Krasnov_immeuble_commercial_appartement_2_chambres.webp']
          for original,nom in zip(src,noms):
            cible=d/nom
            assert not cible.exists(),f'Image déjà présente: {cible}'
            with Image.open(original) as im:
              assert im.width>=1000 and im.height>=700
              im.convert('RGB').save(cible,'WEBP',quality=85,method=6)
            with Image.open(cible) as im:
              assert im.format=='WEBP'
            print(original.name,'->',cible.name,original.stat().st_size,'->',cible.stat().st_size)
            original.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe et banc ciblé
        run: |
          node --check data.js
          node --check plateau-rue-centrale.js
          node outils/bancs/test-krasnov-immeuble-commercial-20261114.mjs
      - name: Publier les images optimisées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- images/Sovarka/Krasnov
          if ! git diff --cached --quiet; then
            git commit -m 'assets(krasnov): trois images de l’immeuble en WebP'
            git push
          fi
