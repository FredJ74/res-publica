name: Novomirsk tribunal - conversion trois scenes WebP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/novomirsk-tribunal-3-images-20261108.yml
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir, integrer, retirer les fichiers remplaces et valider
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('images/Sovarka/Novomirsk')
          files=[
            ('Novomirsk.tribunal.salle audience.png','Novomirsk_tribunal_salle_audience.webp',2361798),
            ('Novomirsk.tribunal.greffe.png','Novomirsk_tribunal_greffe.webp',2538714),
            ('Novomirsk.tribunal.bureau magistrats.png','Novomirsk_tribunal_bureau_magistrats.webp',2459994),
          ]
          old="    'tribunal': {\n      'salle_audience': 'images/tribunal-sovarka.webp',\n      'greffe':         'images/tribunal-sovarka.webp'\n    },"
          new="    'tribunal': {\n      // Decor exclusivement sovarkien ; aucun changement de PNJ, d'ordre ou de salle.\n      'salle_audience': 'images/Sovarka/Novomirsk/Novomirsk_tribunal_salle_audience.webp',\n      'greffe': 'images/Sovarka/Novomirsk/Novomirsk_tribunal_greffe.webp',\n      'bureau_magistrats': 'images/Sovarka/Novomirsk/Novomirsk_tribunal_bureau_magistrats.webp'\n    },"
          data=Path('data.js');js=data.read_text(encoding='utf8')
          soviet=js.index('  soviet: {',js.index('const ROOM_IMAGES_EMPIRE'))
          end=js.index('  khalija: {',soviet)
          section=js[soviet:end]
          if section.count(old)!=1: raise SystemExit('Carte tribunal Sovarka a change: aucune modification')
          for src,dest,length in files:
            source=root/src
            if not source.is_file() or source.stat().st_size!=length:raise SystemExit('Image source manquante ou modifiee: '+str(source))
            if (root/dest).exists():raise SystemExit('Destination deja utilisee: '+dest)
          for src,dest,length in files:
            source=root/src
            out=root/dest
            with Image.open(source) as image:
              image.load()
              size=image.size
              if size[0]<1000 or size[1]<600:raise SystemExit('Dimensions inattendues: '+str(source))
              image.convert('RGB').save(out,format='WEBP',quality=91,method=6)
            with Image.open(out) as check:
              assert check.format=='WEBP' and check.size==size
              check.verify()
            if out.stat().st_size>=length:raise SystemExit('Conversion non optimisee: '+dest)
            print('VALIDEE',src,'VERS',dest,'DIMENSIONS',size,'OCTETS',length,'->',out.stat().st_size)
          js=js[:soviet]+section.replace(old,new)+js[end:]
          if 'images/tribunal-sovarka.webp' in js:
            raise SystemExit('Ancienne image encore referencee dans data.js')
          data.write_text(js,encoding='utf8')
          page=Path('plateau.html')
          markup=page.read_text(encoding='utf8')
          needle='data.js?v='
          if markup.count(needle)!=1:raise SystemExit('Lien data.js introuvable ou multiple')
          index=markup.index(needle)+len(needle)
          closing=markup.index('"',index)
          markup=markup[:closing]+'-tribunal-novomirsk-webp-20261108'+markup[closing:]
          page.write_text(markup,encoding='utf8')
          for src,_,__ in files:(root/src).unlink()
          # Ce vieux fichier etait reserve aux deux salles de Sovarka et est
          # desormais remplace dans les trois salles ; les illustrations
          # partagees avec Republia et les autres pays restent intactes.
          older=Path('images/tribunal-sovarka.webp')
          if not older.is_file():raise SystemExit('Ancienne image tribunal sovarka introuvable')
          older.unlink()
          assert all((root/dest).is_file() and not (root/src).exists() for src,dest,_ in files)
          assert not older.exists()
          assert all('images/Sovarka/Novomirsk/'+dest in js for _,dest,_ in files)
          print('VERIFICATION DES TROIS SALLES ET DE LA SUPPRESSION DES QUATRE ANCIENS FICHIERS: OK')
          PY
          node --check data.js
          # Le vieux banc barreau-temoins-client.js est non executable en direct
          # (ReferenceError: readFile), sans lien avec les images.
          # Les trois correspondances et la non-regression sont testees par
          # le script Python ci-dessus avant chaque suppression.
          node --check plateau-navigation.js
          git add -A -- data.js plateau.html images/Sovarka/Novomirsk images/tribunal-sovarka.webp
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Novomirsk tribunal: trois salles illustrees en WebP'
          git push origin HEAD:main
