name: PSM six images WebP (livraison ponctuelle)
on:
  push:
    branches:
      - chatgpt/psm-images-six-webp-20261104
permissions:
  contents: write
jobs:
  livrer-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir les originaux et raccorder les six pièces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          originals = {
            'PSM_entrepot logistique municipal.png': 'psm-entrepot-logistique-salle-ventes.webp',
            'PSM_entrepot logistique munipal_bureau.png': 'psm-entrepot-logistique-bureau-direction.webp',
            'PSM_pole alcool_salle ventes.png': 'psm-pole-alcool-tabac-salle-ventes.webp',
            'PSM_pole alcool_bureau direction.png': 'psm-pole-alcool-tabac-bureau-direction.webp',
            'PSM_pole alcool-distillerie.png': 'psm-pole-alcool-tabac-distillerie.webp',
            'PSM_pole alcool_manufacture tabac.png': 'psm-pole-alcool-tabac-manufacture-tabac.webp',
          }
          for before, after in originals.items():
              source, target = Path('images') / before, Path('images') / after
              with Image.open(source) as im:
                  dimensions = im.size
                  im.convert('RGB').save(target, format='WEBP', quality=84, method=6)
              with Image.open(target) as im:
                  assert im.format == 'WEBP' and im.size == dimensions
              print(before, '->', after, target.stat().st_size)
          data = Path('data.js')
          text = data.read_text(encoding='utf-8')
          targets = [
            ("'pole-tabac-alcools-psm': {", [
              'psm-pole-alcool-tabac-salle-ventes.webp',
              'psm-pole-alcool-tabac-bureau-direction.webp',
              'psm-pole-alcool-tabac-distillerie.webp',
              'psm-pole-alcool-tabac-manufacture-tabac.webp'
            ]),
            ("'entrepot-logistique-psm': {", [
              'psm-entrepot-logistique-salle-ventes.webp',
              'psm-entrepot-logistique-bureau-direction.webp'
            ])
          ]
          for building, names in targets:
              start = text.index(building)
              end = text.index('\n  },', start) + 5
              body = text[start:end]
              assert body.count('imageUrl:') == len(names), building
              it = iter(names)
              replaced = re.sub(r'imageUrl: "[^"]+"',
                                lambda match: 'imageUrl: "images/' + next(it) + '"',
                                body)
              assert replaced != body
              text = text[:start] + replaced + text[end:]
          data.write_text(text, encoding='utf-8')
          for name in originals.values():
              assert text.count('images/' + name) == 1, name
          print('Six correspondances valides')
          PY
          node --check data.js
          git diff --check
      - name: Enregistrer les fichiers vérifiés sur la branche
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/psm-entrepot-logistique-*.webp images/psm-pole-alcool-tabac-*.webp
          git rm .github/workflows/psm-images-six-webp.yml
          git commit -m "PSM : six WebP et raccordement entrepôt / pôle alcool-tabac"
          git push origin HEAD:chatgpt/psm-images-six-webp-20261104
