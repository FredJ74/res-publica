name: i18n lot civique - contrôle temporaire
on:
  pull_request:
    paths:
      - .github/workflows/i18n-lot-civique-temp.yml
      - i18n/orders-resources.js
      - outils/bancs/banc-i18n-catalogue-ordres.cjs
permissions:
  contents: read
jobs:
  civique:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le catalogue traduit et ses ordres métier
        run: |
          node --check i18n/orders-resources.js
          node --test outils/bancs/banc-i18n-catalogue-ordres.cjs
          node --test outils/bancs/banc-i18n-render-ordres.cjs
          node --test outils/bancs/banc-i18n-ordres.cjs
          git diff --check
