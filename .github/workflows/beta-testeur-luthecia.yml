name: Parcours joueur autorise de Luthecia

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Arnie en consultation seule, ou comptes de test isoles
        type: choice
        default: consultation_seule
        options:
          - consultation_seule
          - tests_isoles
  schedule:
    # UTC. Inactif tant que HG_E2E_NIGHTLY n'est pas explicitement active.
    - cron: '15 1 * * *'

permissions:
  contents: read

concurrency:
  group: luthecia-comptes-test-reserves
  cancel-in-progress: false

jobs:
  parcours-authentifie:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.HG_E2E_NIGHTLY == 'true')
    environment: luthecia-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HG_E2E_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'consultation_seule') || 'tests_isoles' }}
      HG_E2E_DECLENCHEMENT: ${{ github.event_name }}
      HG_E2E_BASE_URL: ${{ vars.HG_E2E_BASE_URL || 'https://res-publica.vercel.app/' }}
      HG_E2E_MAX_MINUTES: '35'
      HG_E2E_RAPPORT: /tmp/luthecia-e2e
      HG_E2E_EMAIL: ${{ secrets[(github.event_name == 'workflow_dispatch' && (inputs.mode || 'consultation_seule') == 'consultation_seule') && 'HG_E2E_ARNIE_EMAIL' || 'HG_E2E_EMAIL'] }}
      HG_E2E_PASSWORD: ${{ secrets[(github.event_name == 'workflow_dispatch' && (inputs.mode || 'consultation_seule') == 'consultation_seule') && 'HG_E2E_ARNIE_PASSWORD' || 'HG_E2E_PASSWORD'] }}
      HG_E2E_PERSONNAGE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'consultation_seule') == 'consultation_seule' && 'Arnie' || secrets.HG_E2E_PERSONNAGE }}
      HG_E2E_UID: ${{ secrets[(github.event_name == 'workflow_dispatch' && (inputs.mode || 'consultation_seule') == 'consultation_seule') && 'HG_E2E_ARNIE_UID' || 'HG_E2E_UID'] }}
      HG_E2E_INVITE_EMAIL: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_INVITE_EMAIL || '' }}
      HG_E2E_INVITE_PASSWORD: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_INVITE_PASSWORD || '' }}
      HG_E2E_INVITE_PERSONNAGE: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_INVITE_PERSONNAGE || '' }}
      HG_E2E_INVITE_UID: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_INVITE_UID || '' }}
      HG_E2E_AUTORISATION_JSON: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_AUTORISATION_JSON || '' }}
      HG_E2E_PLAN_JSON: ${{ (github.event_name == 'schedule' || inputs.mode == 'tests_isoles') && secrets.HG_E2E_PLAN_JSON || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer uniquement le pilote, navigateur systeme existant
        run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - name: Installer Chromium pilote avec les dependances du runner
        run: npx --prefix outils/e2e playwright install --with-deps chromium
      - name: Utiliser le Chromium installe pour le pilote
        run: |
          echo "HG_CHROMIUM=$(node -p \"require('./outils/e2e/node_modules/playwright').chromium.executablePath()\")" >> "$GITHUB_ENV"
      - name: Preparer le dossier du rapport avant toute verification
        run: mkdir -p "$HG_E2E_RAPPORT"
      - name: Exercer le pilote hors production
        run: npm test --prefix outils/e2e
      - name: Prevol obligatoire, aucun contournement des prerequis
        run: npm run prevol --prefix outils/e2e
      - name: Parcours authentifie borne
        run: npm run campagne --prefix outils/e2e
      - name: Resultats, y compris blocages ou echecs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luthecia-joueur-${{ github.run_id }}
          path: /tmp/luthecia-e2e
          retention-days: 3
          if-no-files-found: error
