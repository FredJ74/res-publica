name: Mobile — guidage des pièces masquées
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '24 3 * * *'
  pull_request:
    paths:
      - 'plateau-quete-accueil.js'
      - 'plateau-interieurs-mobile.js'
      - 'outils/bancs/banc-mobile-guidage-pieces-20261124.cjs'
      - '.github/workflows/mobile-guidage-pieces-20261124.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - 'plateau-quete-accueil.js'
      - 'plateau-interieurs-mobile.js'
      - 'outils/bancs/banc-mobile-guidage-pieces-20261124.cjs'
      - '.github/workflows/mobile-guidage-pieces-20261124.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  guidage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test outils/bancs/banc-mobile-guidage-pieces-20261124.cjs
