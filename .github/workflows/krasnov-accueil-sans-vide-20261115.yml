    branches: [chatgpt/krasnov-accueil-supprimer-vide-20261115]
    paths:
      - .github/workflows/krasnov-accueil-sans-vide-20261115.yml
      - style.css
      - plateau-navigation.js
      - plateau.html
      - outils/bancs/test-krasnov-accueil-sans-vide-20261115.mjs
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
