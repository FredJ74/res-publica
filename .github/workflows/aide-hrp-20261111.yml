name: Aide HRP — conseiller universel
on:
  pull_request:
    paths:
      - 'api/aide.js'
      - 'api/_aide-hrp.js'
      - 'plateau-aide.js'
      - 'plateau-aide.css'
      - 'plateau-personnage.js'
      - 'plateau.html'
      - 'i18n/plateau-resources.js'
      - 'vercel.json'
      - 'outils/bancs/banc-aide-hrp-20261111.mjs'
      - '.github/workflows/aide-hrp-20261111.yml'
permissions:
  contents: read
jobs:
  aide:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/aide.js && node --check api/_aide-hrp.js && node --check plateau-aide.js && node --check plateau-personnage.js
      - run: node --test outils/bancs/banc-aide-hrp-20261111.mjs
      - run: git diff --check
