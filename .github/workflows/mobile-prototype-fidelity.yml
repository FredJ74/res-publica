name: Prototype mobile fidélité visuelle
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'plateau.html'
      - 'plateau-mobile-prototype.css'
      - 'plateau-mobile-identite-20261117.js'
      - 'outils/bancs/test-mobile-prototype-fidelity-20261117.cjs'
      - '.github/workflows/mobile-prototype-fidelity.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe
        run: node --check plateau-mobile-identite-20261117.js
      - name: Installer navigateur
        run: |
          cd outils/e2e
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Disposition et ressources du personnage
        run: node outils/bancs/test-mobile-prototype-fidelity-20261117.cjs
