name: One-time Krasnov Ignat image correction
on:
  push:
    branches:
      - chatgpt/correctif-image-ignat-krasnov-20261119
    paths:
      - .github/workflows/ignat-image-correction-once.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Correct source image in place
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          import cv2
          from pathlib import Path
          p=Path('images/Sovarka/Krasnov/Krasnov_maison_ignat_interieur.webp')
          a=np.asarray(Image.open(p).convert('RGB')).copy()
          assert a.shape[:2] == (1086, 1448), a.shape
          original=a.copy()
          mask=np.zeros(a.shape[:2],np.uint8)
          cv2.ellipse(mask,(445,161),(29,22),0,0,360,255,-1)
          mask[:134,:]=0;mask[:,:408]=0;mask[:,479:]=0
          b=cv2.inpaint(cv2.cvtColor(a,cv2.COLOR_RGB2BGR),mask,9,cv2.INPAINT_TELEA)
          a=cv2.cvtColor(b,cv2.COLOR_BGR2RGB)
          crop=original[321:388,569:724].copy()
          crop=cv2.resize(crop,(78,100),interpolation=cv2.INTER_CUBIC)
          gray=cv2.cvtColor(crop,cv2.COLOR_RGB2GRAY)
          sepia=np.stack([np.clip(gray*1.04+12,0,255),np.clip(gray*.94+8,0,255),np.clip(gray*.81+7,0,255)],axis=-1).astype('uint8')
          x0,y0,x1,y1=253,163,331,263
          yy,xx=np.indices((y1-y0,x1-x0))
          alpha=np.minimum.reduce([np.ones_like(xx,dtype=float),(xx+1)/7,(yy+1)/7,(x1-x0-xx)/7,(y1-y0-yy)/7])[:,:,None]*.94
          a[y0:y1,x0:x1]=(a[y0:y1,x0:x1]*(1-alpha)+sepia*alpha).astype('uint8')
          delta=np.any(a!=original,axis=2)
          assert delta.sum() > 9000 and delta.sum() < 12000, delta.sum()
          yy,xx=np.indices(delta.shape)
          allowed=((xx>=408)&(xx<479)&(yy>=134)&(yy<=183))|((xx>=253)&(xx<331)&(yy>=163)&(yy<263))
          assert np.all(~delta|allowed)
          Image.fromarray(a).save(p,'WEBP',quality=90,method=6)
          print('Corrected',p,'changed_pixels',int(delta.sum()))
          PY
      - name: Commit corrected image to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/Sovarka/Krasnov/Krasnov_maison_ignat_interieur.webp
          git commit -m 'fix(krasnov): remove Lenin and prohibited emblem from Ignat interior'
          git push
