name: Aide HRP — questions libres et neuf langues
on:
  pull_request:
    paths:
      - 'api/_aide.js'
      - 'plateau-aide.js'
      - 'plateau-aide.css'
      - 'plateau-personnage.js'
      - 'plateau.html'
      - 'i18n/plateau-resources.js'
      - 'outils/bancs/banc-aide-hrp.mjs'
      - 'outils/bancs/banc-aide-interface.cjs'
      - 'outils/bancs/banc-aide-multilingue.mjs'
      - 'outils/bancs/banc-aide-neuf-langues-navigateur.cjs'
      - 'outils/bancs/fixtures/aide-questions-neuf-langues.json'
      - 'api/_aide-themes.js'
      - 'outils/audits/recetter-aide-neuf-langues.mjs'
      - 'outils/bancs/banc-aide-avancee.mjs'
      - 'outils/bancs/fixtures/aide-avancee-neuf-langues.json'
      - 'outils/bancs/banc-aide-corpus.mjs'
      - 'outils/bancs/fixtures/aide-corpus-neuf-langues.json'
      - '.github/workflows/aide-hrp-check.yml'
permissions:
  contents: read
jobs:
  aide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/_aide.js && node --check plateau-aide.js && node --check plateau-personnage.js && node --check i18n/plateau-resources.js
      - run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - run: node --test outils/bancs/banc-aide-hrp.mjs outils/bancs/banc-aide-multilingue.mjs outils/bancs/banc-aide-corpus.mjs outils/bancs/banc-aide-avancee.mjs
      - run: node --test --test-concurrency=1 outils/bancs/banc-aide-interface.cjs outils/bancs/banc-aide-neuf-langues-navigateur.cjs
      - run: node --test outils/bancs/banc-i18n-guide-mail.cjs outils/bancs/banc-i18n-navbar-20261106.cjs outils/bancs/banc-i18n-tutoriel.cjs
      - run: git diff --check
