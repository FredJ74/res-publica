name: "Santé — Suites : paliers, repas, robustesse, tracts, marchés, objectif (serveur et navigateur)"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '8 3 * * *'
  pull_request:
    paths: ['migrations/20261123100000_sante_suites.sql', 'migrations/20261122230000_sante_socle.sql', 'migrations/20261122232000_sante_consommation.sql', 'outils/bancs/*sante-suites*', 'outils/bancs/fixtures/sante-suites-*', 'outils/bancs/fixtures/sante-consommation-*', 'outils/bancs/fixtures/inventaire-direct-pglite-socle.sql.txt', 'data.js', 'plateau-personnage.js', 'plateau-sovarka-provinces.js', 'plateau-communication.js', 'plateau-politique.js', 'plateau-justice-economie.js', 'plateau-criminalite.js', 'plateau-actions-illegales-rumeurs.js', 'api/_presse-antennes.js', 'admin-maladies.js', '.github/workflows/sante-suites-20261123.yml', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
  push:
    branches: [main, 'claude/**']
    paths: ['migrations/20261123100000_sante_suites.sql', 'migrations/20261122230000_sante_socle.sql', 'migrations/20261122232000_sante_consommation.sql', 'outils/bancs/*sante-suites*', 'outils/bancs/fixtures/sante-suites-*', 'outils/bancs/fixtures/sante-consommation-*', 'outils/bancs/fixtures/inventaire-direct-pglite-socle.sql.txt', 'data.js', 'plateau-personnage.js', 'plateau-sovarka-provinces.js', 'plateau-communication.js', 'plateau-politique.js', 'plateau-justice-economie.js', 'plateau-criminalite.js', 'plateau-actions-illegales-rumeurs.js', 'api/_presse-antennes.js', 'admin-maladies.js', '.github/workflows/sante-suites-20261123.yml', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
permissions:
  contents: read
jobs:
  sante-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # acorn (banc-interview-accueil-antennes) vient d'outils/e2e, comme dans interview-accueil-20261122.yml.
      - run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - name: Navigateur (en-cas / zakouski, repas, forêt, tracts, antenne, objectif) — syntaxe et bancs client
        run: |
          for f in data.js plateau-personnage.js plateau-sovarka-provinces.js plateau-communication.js plateau-politique.js plateau-justice-economie.js plateau-criminalite.js plateau-actions-illegales-rumeurs.js admin-maladies.js; do node --check "$f"; done
          node --test outils/bancs/test-sante-suites-navigateur-20261123.cjs outils/bancs/banc-interview-accueil-antennes-20261122.cjs outils/bancs/banc-i18n-player-missions-20261113.cjs
      - name: PostgreSQL local (PGlite)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.2.17
          PGLITE_DIR="$RUNNER_TEMP/pglite" node --experimental-vm-modules --test outils/bancs/banc-sante-suites-pglite-20261123.cjs
