name: "Décisions du 26/11 — revenu universel, remise à zéro, traduction (PGlite)"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '52 3 * * *'
  pull_request:
    paths: ['data.js', 'plateau-personnage.js', 'admin.html', 'admin-*.js', 'migrations/20261126*', 'outils/bancs/*-20261126.*', 'outils/lancement/**', 'historique/preparations-lancement/**', '.github/workflows/decisions-20261126.yml', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
  push:
    branches: [main, 'claude/**']
    paths: ['data.js', 'plateau-personnage.js', 'admin.html', 'admin-*.js', 'migrations/20261126*', 'outils/bancs/*-20261126.*', 'outils/lancement/**', 'historique/preparations-lancement/**', '.github/workflows/decisions-20261126.yml', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
permissions:
  contents: read
jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PostgreSQL local (PGlite)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.2.17
          PGLITE_DIR="$RUNNER_TEMP/pglite" node --test outils/bancs/*pglite-20261126.cjs
