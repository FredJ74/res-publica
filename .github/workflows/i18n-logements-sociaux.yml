name: i18n — logements sociaux
on:
  pull_request:
    paths:
      - 'plateau-logements-sociaux.js'
      - 'i18n/social-housing-resources.js'
      - 'plateau.html'
      - 'outils/audits/audit-i18n-editorial.cjs'
      - 'outils/bancs/banc-i18n-logements-sociaux-20261112.cjs'
      - '.github/workflows/i18n-logements-sociaux.yml'
permissions:
  contents: read
jobs:
  logements:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plateau-logements-sociaux.js && node --check i18n/social-housing-resources.js
      - run: node --test outils/bancs/banc-i18n-logements-sociaux-20261112.cjs
      - run: node outils/audits/audit-i18n-editorial.cjs > /tmp/audit-i18n-logements.json
      - run: git diff --check
