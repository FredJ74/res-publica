name: "Santé — médecin de terrain, montrer un objet, jauges, forêt en plein air"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '6 3 * * *'
  pull_request:
    paths: [plateau-medecin-montrer.js, plateau-personnage.js, plateau-pnj.js, plateau-surveillance.js, plateau-climat.js, plateau.html, style.css, data.js, 'migrations/20261122230000_sante_socle.sql', 'migrations/20261122234000_medecin_montrer.sql', 'migrations/20261123160000_medecin_paiement_liquide.sql', 'outils/bancs/banc-medecin-montrer-*', 'outils/bancs/banc-medecin-liquide-*', 'outils/bancs/fixtures/medecin-montrer-*', .github/workflows/sante-medecin-20261122.yml]
  push:
    branches: [main, 'claude/**']
    paths: [plateau-medecin-montrer.js, plateau-personnage.js, plateau-pnj.js, plateau-surveillance.js, plateau-climat.js, plateau.html, style.css, data.js, 'migrations/20261122230000_sante_socle.sql', 'migrations/20261122234000_medecin_montrer.sql', 'migrations/20261123160000_medecin_paiement_liquide.sql', 'outils/bancs/banc-medecin-montrer-*', 'outils/bancs/banc-medecin-liquide-*', 'outils/bancs/fixtures/medecin-montrer-*', .github/workflows/sante-medecin-20261122.yml]
permissions:
  contents: read
jobs:
  medecin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - run: for f in plateau-medecin-montrer.js plateau-personnage.js plateau-pnj.js plateau-surveillance.js data.js; do node --check "$f"; done
      - name: Chromium réel, 1280 et 390 px
        env:
          HG_CHROMIUM: /usr/bin/google-chrome
        run: node --test outils/bancs/banc-medecin-montrer-navigateur-20261122.cjs
      - name: PostgreSQL local (PGlite)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.2.17
          PGLITE_DIR="$RUNNER_TEMP/pglite" node --test outils/bancs/banc-medecin-montrer-pglite-20261122.cjs outils/bancs/banc-medecin-liquide-pglite-20261123.cjs
