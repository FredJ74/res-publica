name: Galeries moyens - controle cible temporaire
on:
  pull_request:
    paths:
      - .github/workflows/galeries-moyens-30-test-temp.yml
      - outils/bancs/test-galeries-novomirsk-20261106.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check plateau-variantes-pieces.js
          node --check data.js
          node --test outils/bancs/test-galeries-novomirsk-20261106.mjs
          git diff --check
