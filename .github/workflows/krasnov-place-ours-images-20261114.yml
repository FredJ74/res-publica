name: "Krasnov — cinq images place de l'Ours en WebP"
on:
  push:
    branches:
      - chatgpt/krasnov-place-ours-appartements-20261114
    paths:
      - .github/workflows/krasnov-place-ours-images-20261114.yml
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow
      - name: Convertir, vérifier et effacer les cinq PNG sources
        run: python outils/images/convertir_krasnov_place_ours_20261114.py
      - name: Tester les neuf pièces et les liens
        run: |
          node --check data.js
          node --test outils/bancs/test-krasnov-place-ours-appartements-20261114.mjs
          node --test outils/bancs/test-krasnov-place-ours-20261114.mjs
          node --test outils/bancs/test-krasnov-immeuble-commercial-20261114.mjs
      - name: Committer WebP et suppressions PNG
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/Sovarka/Krasnov/
          git diff --cached --check
          git commit -m "assets(krasnov): cinq WebP place de l'Ours et suppression des PNG d'origine"
          git push origin HEAD:chatgpt/krasnov-place-ours-appartements-20261114
