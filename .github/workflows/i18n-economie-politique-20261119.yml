name: I18n — économie et politique hors justice (19 novembre)
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '42 3 * * *'
  push:
    branches: [chatgpt/i18n-economie-politique-20261119]
    paths:
      - plateau.html
      - plateau-politique.js
      - i18n/commerce-pj-complements-20261119.js
      - i18n/political-org-resources-20261119.js
      - outils/bancs/banc-i18n-economie-politique-20261119.cjs
      - .github/workflows/i18n-economie-politique-20261119.yml
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  pull_request:
    paths:
      - plateau.html
      - plateau-politique.js
      - i18n/commerce-pj-complements-20261119.js
      - i18n/political-org-resources-20261119.js
      - outils/bancs/banc-i18n-economie-politique-20261119.cjs
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plateau-politique.js
      - run: node --check i18n/commerce-pj-complements-20261119.js
      - run: node --check i18n/political-org-resources-20261119.js
      - run: node --test outils/bancs/banc-i18n-economie-politique-20261119.cjs
