name: Novomirsk — intégrer une fois la nef tractoriste WebP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/novomirsk-eglise-webp-once.yml']
permissions:
  contents: write
jobs:
  integrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer Pillow
        run: python -m pip install pillow==11.3.0
      - name: Conversion, raccordement et contrôles atomiques
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source=Path('images/Novomirsk_cathedrale_acceuil.png')
          destination=Path('images/Sovarka/Novomirsk/Novomirsk_cathedrale_accueil.webp')
          assert source.is_file(), f'PNG fourni introuvable: {source}'
          assert not destination.exists(), f'WebP existe déjà, refus écrasement: {destination}'
          destination.parent.mkdir(parents=True,exist_ok=True)
          with Image.open(source) as im:
              assert im.width >= 1000 and im.height >= 700, 'Dimensions inattendues'
              im.convert('RGB').save(destination,format='WEBP',quality=85,method=6)
          with Image.open(destination) as im:
              assert im.format == 'WEBP' and im.width>=1000
          content=Path('data.js').read_text(encoding='utf-8')
          a=content.index("  'kolkhoze-spirituel': {")
          b=content.index("\n  'patisserie-sacree'",a)
          segment=content[a:b]
          old='imageUrl: "https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=1200&q=80"'
          new='imageUrl: "images/Sovarka/Novomirsk/Novomirsk_cathedrale_accueil.webp"'
          assert segment.count(old)==1, 'Liaison de la Grange Sainte différente: ne pas modifier'
          content=content[:a]+segment.replace(old,new)+content[b:]
          Path('data.js').write_text(content,encoding='utf-8')
          source.unlink()
          Path('.github/workflows/novomirsk-eglise-webp-once.yml').unlink()
          assert destination.stat().st_size>10000
          print(f'WebP: {destination} ({destination.stat().st_size} octets); PNG supprimé; imageUrl ciblé')
          PY
          node --check data.js
          test ! -e images/Novomirsk_cathedrale_acceuil.png
          test -s images/Sovarka/Novomirsk/Novomirsk_cathedrale_accueil.webp
          grep -Fq 'imageUrl: "images/Sovarka/Novomirsk/Novomirsk_cathedrale_accueil.webp"' data.js
      - name: Commit et push, avec protection contre les mises à jour concurrentes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Novomirsk_cathedrale_acceuil.png images/Sovarka/Novomirsk/Novomirsk_cathedrale_accueil.webp .github/workflows/novomirsk-eglise-webp-once.yml
          git commit -m "Novomirsk : nef tractoriste WebP, supprimer PNG et raccorder la salle"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Échec push après résolution des évolutions concurrentes" >&2
          exit 1
