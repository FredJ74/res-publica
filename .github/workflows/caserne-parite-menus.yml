name: Casernes — parité et menus lisibles
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'data.js'
      - 'plateau-politique.js'
      - 'i18n/room-actions-resources.js'
      - 'outils/bancs/banc-caserne-parite-menus-20261113.cjs'
      - 'migrations/20261113230500_commandant_pnj_caserne_novomirsk.sql'
      - '.github/workflows/caserne-parite-menus.yml'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'plateau-politique.js'
      - 'i18n/room-actions-resources.js'
      - 'outils/bancs/banc-caserne-parite-menus-20261113.cjs'
      - 'migrations/20261113230500_commandant_pnj_caserne_novomirsk.sql'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plateau-politique.js && node --check data.js && node --check i18n/room-actions-resources.js
      - run: node --test outils/bancs/banc-caserne-parite-menus-20261113.cjs
      - run: node --test outils/bancs/banc-mandats-nationaux-caserne-20261113.cjs
