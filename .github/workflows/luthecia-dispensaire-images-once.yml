name: "Luthécia dispensaire — conversion ponctuelle"
on:
  push:
    branches:
      - fix/luthecia-dispensaire-images-20261124
    paths:
      - .github/workflows/luthecia-dispensaire-images-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/luthecia-dispensaire-images-once.yml
permissions:
  contents: write
jobs:
  convertir-et-raccorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: "Convertir les deux PNG et ne modifier que le dispensaire de Luthécia"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import unicodedata
          from PIL import Image
          def normaliser(texte):
              return ''.join(ch for ch in unicodedata.normalize('NFKD', texte) if not unicodedata.combining(ch)).lower()
          png = list(Path('images').glob('*.png'))
          def trouver(*mots):
              matches = [p for p in png if all(mot in normaliser(p.name) for mot in mots)]
              assert len(matches) == 1, (mots, [str(m) for m in matches])
              return matches[0]
          sources = {
              'accueil': trouver('reception d', 'hopital vintage', 'lampe'),
              'chambre': trouver('chambre privee', 'hopital victorien'),
          }
          for partie, source in sources.items():
              destination = Path(f'images/luthecia-dispensaire-{partie}.webp')
              assert not destination.exists(), destination
              with Image.open(source) as im:
                  im.convert('RGB').save(destination, 'WEBP', quality=84, method=6)
              with Image.open(destination) as check:
                  assert check.format == 'WEBP' and check.width >= 1000, destination
              print(source, '→', destination, destination.stat().st_size, 'octets')
          path = Path('data.js')
          texte = path.read_text(encoding='utf-8')
          ancre = '// STAROVKA ET KRASNOV : TEXTES DU GABARIT DE MONTROUGE'
          assert texte.count(ancre) == 1, 'Ancre hospitalière inattendue'
          patch = """// IMAGES PROPRES AU DISPENSAIRE PUBLIC DE LUTHÉCIA (24/11/2026).
          // Ne jamais changer BUILDINGS['dispensaire-public'] ni la chambre générique
          // de Montrouge : ces objets sont partagés avec d'autres villes/pays.
          (function () {
            const h = WORLD.republic.capitale.buildingContext['dispensaire-public'];
            if (!h || !h.roomsExtra || !h.roomsExtra.chambre) throw new Error('Dispensaire de Luthécia incomplet');
            h.roomOverrides = h.roomOverrides || {};
            h.roomOverrides.salle_attente = Object.assign({}, h.roomOverrides.salle_attente || {}, {
              name: 'Accueil',
              imageUrl: 'images/luthecia-dispensaire-accueil.webp'
            });
            h.roomsExtra.chambre = Object.assign({}, h.roomsExtra.chambre, {
              imageUrl: 'images/luthecia-dispensaire-chambre.webp'
            });
          })();

          """
          assert patch not in texte
          texte = texte.replace(ancre, patch + ancre, 1)
          old = 'name: "Dispensaire Public de Luthecia",\n          desc: "Docteur Aspirine prescrit du repos pour tout.",\n          persons: [{"name": "Docteur Aspirine (PNJ)"'
          new = 'name: "Dispensaire Public de Luthecia",\n          desc: "Mathias Spirine consulte les dossiers médicaux.",\n          persons: [{"name": "Mathias Spirine (PNJ)"'
          assert texte.count(old) == 1, 'Le PNJ à corriger est introuvable ou ambigu'
          texte = texte.replace(old, new, 1)
          path.write_text(texte, encoding='utf-8')
          PY
          node --check data.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const ctx={console,window:{}};ctx.window=ctx;vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8')+';globalThis.__W = WORLD;',ctx);
          const w=ctx.__W, l=w.republic.capitale.buildingContext['dispensaire-public'];
          const p=w.republic.ville_a.buildingContext['dispensaire-public-v'];
          const m=w.republic.ville_b.buildingContext['dispensaire-public-v'];
          if(l.roomOverrides.salle_attente.imageUrl!=='images/luthecia-dispensaire-accueil.webp') throw Error('Accueil non raccordé');
          if(l.roomsExtra.chambre.imageUrl!=='images/luthecia-dispensaire-chambre.webp') throw Error('Chambre non raccordée');
          if(p.roomsExtra.chambre.imageUrl==='images/luthecia-dispensaire-chambre.webp'||m.roomsExtra.chambre.imageUrl==='images/luthecia-dispensaire-chambre.webp')throw Error('Fuite sur ville voisine');
          if(!l.persons.some(x=>x.name==='Mathias Spirine (PNJ)'))throw Error('Mathias Spirine absent');
          console.log('Contrôle ciblé Luthécia OK. PSM/Montrouge inchangés.');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/luthecia-dispensaire-accueil.webp images/luthecia-dispensaire-chambre.webp
          git rm -- "images/Chambre privée d’hôpital victorien détaillée.png" "images/Réception d’hôpital vintage éclairée à la lampe.png"
          git commit -m "Luthécia : accueil et chambre du dispensaire en WebP (images et PNJ)"
          git push
