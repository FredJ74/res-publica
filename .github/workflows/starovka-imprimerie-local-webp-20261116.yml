name: "Starovka — imprimerie Metel et local à louer en WebP"
on:
  push:
    branches: [chatgpt/starovka-imprimerie-local-webp-20261116]
    paths:
      - .github/workflows/starovka-imprimerie-local-webp-20261116.yml
permissions:
  contents: write
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Convertir, retirer les PNG et raccorder les vitrines
        run: python outils/images/implanter_starovka_imprimerie_local_20261116.py
      - name: Vérifier la syntaxe et les accès locaux
        run: |
          node --check data.js
          node --check plateau-rue-centrale.js
          node outils/bancs/test-starovka-imprimerie-local-20261116.cjs
      - name: Pousser les deux WebP et les modifications
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js plateau-rue-centrale.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : imprimerie et local commercial en WebP, accès depuis la rue"
          git push origin HEAD:chatgpt/starovka-imprimerie-local-webp-20261116
