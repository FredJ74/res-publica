name: I18N — descriptions de Krasnov
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '6 3 * * *'
  pull_request:
    paths: ['plateau.html', 'plateau-navigation.js', 'i18n/sovarka-descriptions-resources.js', 'i18n/packed/sovarka-descriptions-resources.js.br', 'outils/audits/I18N-CATALOGUES-TRANSPORT.json', 'outils/bancs/banc-i18n-krasnov-descriptions-20261115.cjs', 'outils/audits/I18N-KRASNOV-DESCRIPTIONS-871-*', '.github/workflows/i18n-krasnov-descriptions-20261115.yml', 'data.js', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
  push:
    branches: [main]
    paths: ['plateau.html', 'plateau-navigation.js', 'i18n/sovarka-descriptions-resources.js', 'outils/bancs/banc-i18n-krasnov-descriptions-20261115.cjs', '.github/workflows/i18n-krasnov-descriptions-20261115.yml', 'data.js', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
permissions:
  contents: read
jobs:
  descriptions-krasnov:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix outils/e2e
      - run: node outils/generateurs/compresser-catalogues-i18n.cjs --check
      - name: Français et anciennes traductions identiques, neuf langues, progression/saisie/position et RTL sans RPC/PA
        env:
          RP_I18N_KRASNOV_BASELINE: "1"
          NODE_PATH: ./outils/e2e/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test outils/bancs/banc-i18n-krasnov-descriptions-20261115.cjs outils/bancs/test-i18n-sovarka-descriptions-20261112.mjs outils/bancs/test-krasnov-musee-20261114.mjs
      - run: git diff --check
