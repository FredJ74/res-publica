name: "Starovka — deux commerces WebP"
on:
  push:
    branches: [chatgpt/starovka-commerces-deux-webp-20261116]
    paths:
      - .github/workflows/starovka-commerces-deux-webp-20261116.yml
      - outils/images/implanter_starovka_commerces_20261116.py
      - outils/bancs/test-starovka-commerces-deux-webp-20261116.cjs
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Convertir et raccorder les deux images
        run: python outils/images/implanter_starovka_commerces_20261116.py
      - name: Contrôles des images et des mécaniques préservées
        run: |
          node --check data.js
          node outils/bancs/test-starovka-commerces-deux-webp-20261116.cjs
      - name: Commiter les deux WebP et retirer les anciens PNG
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : restaurant et fourreur en WebP"
          git push origin HEAD:chatgpt/starovka-commerces-deux-webp-20261116
