name: I18N — Actions de salles et audioguides
on:
  pull_request:
    paths:
      - 'i18n/room-actions-resources.js'
      - 'plateau-politique.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-room-actions.cjs'
      - '.github/workflows/i18n-room-actions.yml'
  push:
    paths:
      - 'i18n/room-actions-resources.js'
      - 'plateau-politique.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-room-actions.cjs'
      - '.github/workflows/i18n-room-actions.yml'
jobs:
  salles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check i18n/room-actions-resources.js
          node --check plateau-politique.js
          node --check outils/bancs/banc-i18n-room-actions.cjs
      - run: node --test outils/bancs/banc-i18n-room-actions.cjs
