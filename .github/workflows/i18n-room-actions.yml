name: I18N — Actions de salles et audioguides
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '16 3 * * *'
  pull_request:
    paths:
      - 'i18n/room-actions-resources.js'
      - 'plateau-politique.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-room-actions.cjs'
      - '.github/workflows/i18n-room-actions.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    paths:
      - 'i18n/room-actions-resources.js'
      - 'plateau-politique.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-room-actions.cjs'
      - '.github/workflows/i18n-room-actions.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  salles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check i18n/room-actions-resources.js
          node --check plateau-politique.js
          node --check outils/bancs/banc-i18n-room-actions.cjs
      - run: node --test outils/bancs/banc-i18n-room-actions.cjs
