name: Novomirsk — portraits WebP des escorts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/escorts-sovarka-webp-20261112.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Convertir et vérifier les portraits et vignettes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path('images/Sovarka/Novomirsk')
          names={
            'Sovarka_escort_Ludmilla Bonaskova.png':'Sovarka_escort_Ludmilla_Bonaskova',
            'Sovarka_escort_Boris Kostov.png':'Sovarka_escort_Boris_Kostof'
          }
          for original,stem in names.items():
              source=folder/original
              assert source.is_file(), f'Image source absente: {source}'
              portrait=folder/(stem+'.webp')
              vignette=folder/(stem+'_vignette.webp')
              with Image.open(source) as im:
                  im.load()
                  assert im.width>=800 and im.height>=800, f'Dimensions inattendues: {source}'
                  color=im.convert('RGB')
                  color.save(portrait,'WEBP',quality=85,method=6)
                  ratio=400/color.width
                  thumb=color.resize((400,round(color.height*ratio)),Image.Resampling.LANCZOS)
                  thumb.save(vignette,'WEBP',quality=78,method=6)
              for output in (portrait,vignette):
                  assert output.stat().st_size>10000, f'Image suspecte: {output}'
                  with Image.open(output) as im:
                      im.verify()
              source.unlink()
              print(f'{source.name} => {portrait.name} / {vignette.name}')
          PY
      - name: Commit et push des WebP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/Sovarka/Novomirsk/Sovarka_escort_*
          if ! git diff --cached --quiet; then
            git commit -m 'art: WebP et vignettes des deux escorts de Sovarka'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
