name: Pharmanov Novomirsk - convertir et raccorder trois vues WebP
on:
  push:
    branches:
      - chatgpt/pharmanov-images-20261111
    paths:
      - .github/workflows/novomirsk-pharmanov-webp-20261111.yml
permissions:
  contents: write
jobs:
  conversion-raccordement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir les trois PNG de Pharmanov et verifier les WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          root=Path('images/Sovarka/Novomirsk')
          files=[
              ('Novomirsk.Pharmanov.accueil.png','Novomirsk_Pharmanov_accueil.webp'),
              ('Novomirsk.Pharmanov.bureau direction.png','Novomirsk_Pharmanov_bureau_direction.webp'),
              ('Novomirsk.pharmanov.usine.png','Novomirsk_Pharmanov_production.webp'),
          ]
          for old,new in files:
              src,dest=root/old,root/new
              assert src.is_file(),f'PNG introuvable : {src}'
              assert not dest.exists(),f'WebP deja present : {dest}'
              with Image.open(src) as im:
                  rgb=ImageOps.exif_transpose(im).convert('RGB')
                  dimensions=rgb.size
                  rgb.save(dest,format='WEBP',quality=85,method=6)
              with Image.open(dest) as converted:
                  assert converted.format=='WEBP' and converted.size==dimensions
                  converted.load()
              assert dest.stat().st_size>1000
              src.unlink()
              print(f'{old} -> {new} ({dimensions}, {dest.stat().st_size} octets)')
          assert all((root/new).is_file() and not (root/old).exists() for old,new in files)
          PY
      - name: Raccorder uniquement les trois salles de Pharmanov a Sovarka
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data.js')
          text=p.read_text(encoding='utf-8')
          debut=text.index("        'usine-pharmaceutique-luthecia': {")
          fin=text.index("        // Musee de la Republique de Sovarka",debut)
          bloc=text[debut:fin]
          old="          imagesAVenir: true,"
          assert bloc.count(old)==1
          bloc=bloc.replace(old,"          imagesAVenir: false,",1)
          old="            salle_ventes: { excludeOrders: ['acheter_sels_ammoniaque'] },"
          assert bloc.count(old)==1
          bloc=bloc.replace(old,"            salle_ventes: { imageUrl: 'images/Sovarka/Novomirsk/Novomirsk_Pharmanov_accueil.webp', excludeOrders: ['acheter_sels_ammoniaque'] },",1)
          old="            salle_production: { excludeOrders: ['produire_medicaments', 'produire_desinfectant'], orders: ["
          assert bloc.count(old)==1
          bloc=bloc.replace(old,"            salle_production: { imageUrl: 'images/Sovarka/Novomirsk/Novomirsk_Pharmanov_production.webp', excludeOrders: ['produire_medicaments', 'produire_desinfectant'], orders: [",1)
          old="            bureau_direction: { persons: [{name: 'Boris Kovaliov (PNJ)',"
          assert bloc.count(old)==1
          bloc=bloc.replace(old,"            bureau_direction: { imageUrl: 'images/Sovarka/Novomirsk/Novomirsk_Pharmanov_bureau_direction.webp', persons: [{name: 'Boris Kovaliov (PNJ)',",1)
          text=text[:debut]+bloc+text[fin:]
          p.write_text(text,encoding='utf-8')
          for page in ('plateau.html','index.html'):
              f=Path(page)
              t=f.read_text(encoding='utf-8')
              import re
              # Change la version du catalogue pour vider le cache des vues.
              t2,n=re.subn(r'(src="data\.js\?v=[^"]+)',r'\1-pharmanov-webp-20261111',t,count=1)
              assert n==1 and t2!=t, f'Balise data.js absente : {page}'
              f.write_text(t2,encoding='utf-8')
          print('3 overrides Pharmanov et versions data.js OK')
          PY
      - name: Controles fonctionnels non destructifs
        run: |
          node --check data.js
          python - <<'PY'
          from pathlib import Path
          s=Path('data.js').read_text()
          a=s.index("        'usine-pharmaceutique-luthecia': {")
          b=s.index('        // Musee de la Republique de Sovarka',a)
          scope=s[a:b]
          root=Path('.')
          for salle,image in [('salle_ventes','Novomirsk_Pharmanov_accueil.webp'),('bureau_direction','Novomirsk_Pharmanov_bureau_direction.webp'),('salle_production','Novomirsk_Pharmanov_production.webp')]:
              path=f'images/Sovarka/Novomirsk/{image}'
              assert scope.count(path)==1,(salle,path)
              assert (root/path).is_file()
          assert 'imagesAVenir: false' in scope
          assert 'acheter_sels_ammoniaque' in scope
          assert 'produire_medicaments' in scope and 'produire_desinfectant' in scope
          assert 'Boris Kovaliov (PNJ)' in scope
          assert all('pharmanov-webp-20261111' in Path(n).read_text() for n in ('plateau.html','index.html'))
          print('OK : trois images existantes, 3 salles, mecanique intacte, cache rafraichi')
          PY
          git diff --check
      - name: Commit de conversion et raccordement
        run: |
          git add -A -- images/Sovarka/Novomirsk/ data.js plateau.html index.html
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'images(sovarka): convertir et raccorder les trois vues Pharmanov'
          git push origin HEAD:chatgpt/pharmanov-images-20261111
