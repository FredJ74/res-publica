name: Novomirsk - conversion notariale unique
on:
  push:
    branches:
      - chatgpt/novomirsk-notaire-images-20261106
    paths:
      - .github/workflows/novomirsk-notaire-convert-20261106.yml
  pull_request:
    paths:
      - .github/workflows/novomirsk-notaire-convert-20261106.yml
permissions:
  contents: write
jobs:
  convert-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer le convertisseur WebP
        run: python -m pip install --user Pillow==11.3.0
      - name: Convertir les images originales et supprimer les PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          root=Path('images/Sovarka/Novomirsk')
          mapping={
            'Novomirsk_notaire_bureau succession.png':'Novomirsk_notaire_successions.webp',
            'Novomirsk_notaire_bureau.png':'Novomirsk_notaire_cessions_entreprises.webp'
          }
          for source,target in mapping.items():
              inp=root/source
              out=root/target
              if inp.is_file():
                  with Image.open(inp) as im:
                      if im.size != (1536,1024):
                          raise SystemExit('Dimensions inattendues: '+source+' '+str(im.size))
                      im.convert('RGB').save(out,'WEBP',quality=85,method=6)
                  print(source, 'sha256', hashlib.sha256(inp.read_bytes()).hexdigest())
                  inp.unlink()
              elif not out.is_file():
                  raise SystemExit('Ni PNG ni WebP présent : '+source)
              else:
                  print('Conversion déjà effectuée :',target)
              with Image.open(out) as im:
                  if im.format != 'WEBP' or im.size != (1536,1024):
                      raise SystemExit('WebP illisible: '+target)
              if out.stat().st_size < 100000:
                  raise SystemExit('WebP trop petit: '+target)
              print(target, 'sha256', hashlib.sha256(out.read_bytes()).hexdigest(), 'bytes', out.stat().st_size)
          PY
      - name: Contrôler les deux pièces et les ordres du notaire
        run: |
          node --test outils/bancs/test-novomirsk-notaire-deux-bureaux-20261106.mjs
          node --test outils/bancs/test-novomirsk-commissariat-notaire-portraits-20261106.mjs
          git diff --check
      - name: Enregistrer les WebP sur la branche de la PR 529
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/Sovarka/Novomirsk
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "assets(novomirsk): deux bureaux notariaux WebP, PNG supprimés"
          fi
          git push origin HEAD:refs/heads/chatgpt/novomirsk-notaire-images-20261106
