name: Conversion unique — clinique Saint-Pavel (Novomirsk)
on:
  pull_request:
    paths:
      - 'data.js'
      - 'images/Sovarka/Novomirsk/Novomirsk_clinique_*.png'
      - '.github/workflows/clinique-saint-pavel-webp-20261112.yml'
permissions:
  contents: write
jobs:
  convertir-webp:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout de la branche (jamais main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convertir les deux PNG sans modifier leurs dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("images/Sovarka/Novomirsk")
          for stem in ["Novomirsk_clinique_accueil","Novomirsk_clinique_chambre"]:
              src=folder/(stem+".png")
              dst=folder/(stem+".webp")
              if not src.is_file() and dst.is_file():
                  with Image.open(dst) as check:
                      check.verify()
                  print(f"Déjà converti : {dst}")
                  continue
              if not src.is_file():
                  raise SystemExit(f"Image absente : {src}")
              with Image.open(src) as image:
                  size=image.size
                  if image.mode not in ("RGB","RGBA"):
                      image=image.convert("RGB")
                  image.save(dst,"WEBP",quality=85,method=6)
              with Image.open(dst) as check:
                  check.verify()
              with Image.open(dst) as check:
                  if check.size != size:
                      raise SystemExit(f"Dimensions altérées pour {dst}")
              src.unlink()
              print(f"OK : {src} -> {dst}, dimensions {size}")
          PY
      - name: Publier les deux WebP et supprimer les PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- images/Sovarka/Novomirsk
          if git diff --cached --quiet; then
            echo "Conversion déjà intégrée."
          else
            git diff --cached --stat
            git commit -m "Images Saint-Pavel : WebP accueil et chambre, retirer les deux PNG"
            git push origin HEAD:${{ github.head_ref }}
          fi
