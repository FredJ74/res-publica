name: Titres ministeriels — isolation des empires
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '2 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/intitules-ministeres-empires-20261107.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'outils/bancs/banc-intitules-ministeres-empires.cjs'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check data.js
          node --check plateau-core.js
          node --test outils/bancs/banc-intitules-ministeres-empires.cjs outils/bancs/banc-hydratation-personnage.cjs
          git diff --check
