name: Résidence impériale — conversion PNG vers WebP (lot ponctuel)
on:
  push:
    branches: [chatgpt/residence-imperiale-six-webp-20261111]
    paths:
      - '.github/workflows/residence-imperiale-convert-once-20261111.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/residence-imperiale-six-webp-20261111
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir, relire et supprimer les six PNG d'origine
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 outils/audits/convertir-residence-imperiale-20261111.py
          python3 outils/bancs/banc-residence-imperiale-webp-20261111.py
      - name: Sauver le lot et supprimer le workflow temporaire
        run: |
          set -euo pipefail
          rm .github/workflows/residence-imperiale-convert-once-20261111.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/Sovarka/Novomirsk outils/audits/residence-imperiale-six-webp-20261111.json .github/workflows/residence-imperiale-convert-once-20261111.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Résidence impériale : 6 PNG en WebP, suppression des anciens"
          git push origin HEAD:chatgpt/residence-imperiale-six-webp-20261111
