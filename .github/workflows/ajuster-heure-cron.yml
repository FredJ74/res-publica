name: Ajuster automatiquement l'heure du cron (minuit Paris)

on:
  schedule:
    # Tous les jours a 3h UTC : maintient minuit Paris ; aucun commit si deja conforme.
    - cron: '0 3 * * *'
  workflow_dispatch: {}
    # Permet de declencher le workflow a la main depuis l'onglet "Actions" de GitHub,
    # utile pour tester sans attendre la vraie date de changement d'heure.

jobs:
  ajuster-cron:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maintenir minuit Paris et reparer une configuration saisonniere perimee
        run: python3 outils/ajuster-cron-vercel.py
      - name: Verifier que la configuration reste deployable
        run: python3 outils/baseline/verifier-workflow.py

      - name: Commit et push si vercel.json a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet vercel.json; then
            git add vercel.json
            git commit -m "Ajustement automatique du cron pour l'heure d'ete/hiver (minuit Paris)"
            git push
          else
            echo "Aucun changement a committer."
          fi
