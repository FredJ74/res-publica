name: Installer le bureau du président du Dynamo en WebP
on:
  push:
    branches:
      - chatgpt/dynamo-bureau-president-webp-20261110
    paths:
      - 'outils/images/installer_bureau_president_dynamo_20261110.py'
      - 'data.js'
      - '.github/workflows/installer-bureau-dynamo-webp.yml'
  pull_request:
    paths:
      - 'images/Sovarka/Novomirsk/Novomirsk.stade.bureau président.webP'
      - 'images/Sovarka/Novomirsk/Les cinq triomphes mondiaux du Dynamo Novomirsk.png'
      - 'data.js'
      - 'outils/images/installer_bureau_president_dynamo_20261110.py'
permissions:
  contents: write
jobs:
  conversion-et-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Convertir / vérifier
        run: python outils/images/installer_bureau_president_dynamo_20261110.py
      - name: Contrôler le raccordement
        run: |
          node --check data.js
          node --test outils/bancs/test-dynamo-novomirsk-20261110.mjs
      - name: Commit des visuels convertis
        if: github.event_name == 'push'
        run: |
          git add -A -- 'images/Sovarka/Novomirsk/Les cinq triomphes mondiaux du Dynamo Novomirsk.png' 'images/Sovarka/Novomirsk/Novomirsk.stade.bureau président.webP'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Installer l’image WebP du bureau du président et supprimer le PNG'
            git push origin HEAD:chatgpt/dynamo-bureau-president-webp-20261110
          fi
