name: "Novomirsk V14 — images des Quais"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '16 3 * * *'
  push:
    branches:
      - chatgpt/novomirsk-v14-images-quais-20261112
  pull_request:
    paths:
      - data.js
      - outils/bancs/test-novomirsk-v14-images-quais-20261112.mjs
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check data.js
      - run: node --test outils/bancs/test-novomirsk-v14-images-quais-20261112.mjs outils/bancs/test-logements-marche-novomirsk-20261112.mjs
