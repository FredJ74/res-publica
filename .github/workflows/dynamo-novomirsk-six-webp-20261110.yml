name: Dynamo Novomirsk — six PNG vers WebP
on:
  push:
    branches:
      - chatgpt/dynamo-six-salles-webp-20261110
    paths:
      - '.github/workflows/dynamo-novomirsk-six-webp-20261110.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir les six PNG et vérifier les six WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          root=Path('images/Sovarka/Novomirsk')
          names=["terrain","vestiaire","buvette","boutique","bookmaker","club"]
          assert len(set(names)) == 6
          for stem in names:
              src=root/('Novomirsk.stade.'+stem+'.png')
              dest=src.with_suffix('.webp')
              if not src.exists():
                  assert dest.exists(), str(src)
                  continue
              assert not dest.exists(), 'Collision avec un WebP existant: '+str(dest)
              with Image.open(src) as im:
                  rgb=ImageOps.exif_transpose(im).convert('RGB')
                  size=rgb.size
                  rgb.save(dest,format='WEBP',quality=85,method=6)
              with Image.open(dest) as image:
                  assert image.format=='WEBP' and image.size==size
                  image.verify()
              assert dest.stat().st_size>10000
              src.unlink()
              print(f'Conversion: {src} -> {dest} ({dest.stat().st_size} bytes)')
          for stem in names:
              src=root/('Novomirsk.stade.'+stem+'.png')
              dst=root/('Novomirsk.stade.'+stem+'.webp')
              assert not src.exists() and dst.exists()
              with Image.open(dst) as image:
                  assert image.format=='WEBP'
                  image.load()
          print('6/6 WebP valides, PNG sources supprimes')
          PY
      - name: Publier les six WebP après validation
        run: |
          git add -A -- images/Sovarka/Novomirsk/Novomirsk.stade.*
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Aucun changement binaire à publier"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(dynamo): convertir six images du stade en WebP et supprimer PNG'
          git push origin HEAD:chatgpt/dynamo-six-salles-webp-20261110
