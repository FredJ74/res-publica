name: Tests fermetures calendrier universel
on:
  pull_request:
    paths:
      - 'plateau-core.js'
      - 'supabase.js'
      - 'migrations/20261031113548_fermetures_date_universelle.sql'
      - 'outils/bancs/test-fermetures-jours-civils.mjs'
      - '.github/workflows/test-fermetures-jours-civils.yml'
  push:
    branches:
      - 'correctif/fermetures-calendrier-universel-20261017'
# Annuler seulement les executions perimees d'une meme PR ; main reste integral.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fermetures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test outils/bancs/test-fermetures-jours-civils.mjs
