name: Audit PNG vers WebP
on:
  pull_request:
    paths:
      - 'images/**'
      - 'outils/images/**'
      - '.github/workflows/audit-png-webp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow==11.3.0
      - name: Auditer sans modifier
        run: python outils/images/auditer_png_webp.py --report audit-png-webp.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-png-webp
          path: audit-png-webp.json
      - name: Construire les WebP candidats sur runner sans pousser
        run: |
          python outils/images/auditer_png_webp.py --apply --report conversion-png-webp.json > /dev/null
          git diff --check
          git status --short > conversion-fichiers.txt
      - name: Archiver le résultat pour inspection avant intégration
        uses: actions/upload-artifact@v4
        with:
          name: conversion-webp-a-verifier
          path: |
            conversion-png-webp.json
            conversion-fichiers.txt
            images/**/*.webp
            images/*.webp
          retention-days: 7
