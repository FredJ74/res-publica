name: Conversion ponctuelle des images de Ciudad Roja
on:
  push:
    paths:
      - '.github/workflows/temp-convert-ciudad-roja-images.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convertir et vérifier les quatre images puis retirer les PNG
        shell: bash
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          root=Path('images/El Estado/Ciudad Roja')
          files={
            'Centre multimodal El Estado en effervescence.png':('Ciudad_Roja_centre_multimodal_exterieur.webp','9c55dbfbb54c5e969a322cbb01118d12031b94c1'),
            'Hall multimodal d’El Estado en effervescence.png':('Ciudad_Roja_centre_multimodal_hall.webp','9f140cdafc01d66c7acfb69b645b584408664796'),
            'Contrôle douanier à El Estado.png':('Ciudad_Roja_centre_multimodal_douanes.webp','eb02b0a04e36914809ce3a9d8723d8827ce63dce'),
            'Embarquement tropical à la porte A3.png':('Ciudad_Roja_centre_multimodal_embarquement.webp','1b8ca3827b91880bc10761b641e2842a48377fe1')
          }
          def gitsha(data):
            h=hashlib.sha1()
            h.update(f'blob {len(data)}\\0'.encode().replace(b'\\\\0',b'\\0'))
            h.update(data)
            return h.hexdigest()
          for filename,(out,expected) in files.items():
            source=root/filename
            data=source.read_bytes()
            assert gitsha(data)==expected, f'Source image modifiée: {filename}'
            dest=root/out
            assert not dest.exists(), f'Destination existe déjà: {dest}'
            with Image.open(source) as im:
              im.convert('RGB').save(dest,'WEBP',quality=86,method=6)
            with Image.open(dest) as result:
              result.verify()
            assert dest.read_bytes()[0:4]==b'RIFF' and dest.read_bytes()[8:12]==b'WEBP'
          for filename in files:
            (root/filename).unlink()
          print('4 WebP vérifiés, 4 PNG supprimés')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'images/El Estado/Ciudad Roja'
          git commit -m "chore(images): convertir quatre images Ciudad Roja en WebP"
          git push
