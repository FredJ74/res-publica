name: Convertir Starovka gare et port en WebP
on:
  push:
    branches: [main]
    paths:
      - 'outils/images/convertir_starovka_gare_port_20261105.py'
      - '.github/workflows/convertir-starovka-gare-port-20261105.yml'
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir et supprimer les originaux après contrôle
        run: python outils/images/convertir_starovka_gare_port_20261105.py
      - name: Vérifier toutes les images livrées
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          directory=Path('images/Sovarka/Starovka')
          assert not list(directory.glob('*.png'))
          for name in ('Starovka_rue_gare.webp','Starovka_rue_port industriel.webp'):
              file=directory/name
              assert file.stat().st_size>100
              with Image.open(file) as im:
                  assert im.format=='WEBP'
                  im.verify()
              print(name, file.stat().st_size)
          PY
          git diff --check
      - name: Publier uniquement les images
        run: |
          git add -A -- images/Sovarka/Starovka
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(starovka): WebP gare port, PNG supprimés'
          git push origin HEAD:main
