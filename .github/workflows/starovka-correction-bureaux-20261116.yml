name: Starovka - reparer les bureaux et convertir le poste
on:
  push:
    branches: [chatgpt/starovka-correction-bureaux-20261116]
    paths: ['.github/workflows/starovka-correction-bureaux-20261116.yml']
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Reaffecter les images puis convertir le nouveau poste
        run: python outils/images/starovka_corriger_bureaux_20261116.py
      - name: Contrôler les ressources et la syntaxe
        run: |
          node --check data.js
          node --check plateau-open-space.js
          git diff --check
      - name: Commit les ressources définitives
        run: |
          git add -A -- images/Sovarka/Starovka
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(starovka): reaffecter les trois scenes et convertir le poste"
          git push origin HEAD:chatgpt/starovka-correction-bureaux-20261116
