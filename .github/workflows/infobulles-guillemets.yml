name: Infobulles — guillemets HTML
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '42 3 * * *'
  pull_request:
    paths:
      - 'plateau-politique.js'
      - 'outils/bancs/banc-infobulles-guillemets-20261113.cjs'
      - 'outils/bancs/banc-ordres-info-tactile-20261113.cjs'
      - '.github/workflows/infobulles-guillemets.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  guillemets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check plateau-politique.js
      - run: node --test outils/bancs/banc-infobulles-guillemets-20261113.cjs outils/bancs/test-i18n-infobulles-communes-20261113.mjs outils/bancs/test-i18n-sovarka-infobulles-20261113.mjs
      - run: git diff --check
