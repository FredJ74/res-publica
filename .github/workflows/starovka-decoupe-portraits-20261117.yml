name: "Starovka — découpe et pose des portraits"
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "outils/images/decouper_portraits_starovka_20261117.py"
      - ".github/workflows/starovka-decoupe-portraits-20261117.yml"
jobs:
  decoupe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Découper, vérifier et raccorder
        run: |
          if grep -q 'STAROVKA_PORTRAITS_MANQUANTS_20261117' data.js; then
            echo "Découpage déjà commité sur la branche, vérification des fichiers uniquement"
          else
            python outils/images/decouper_portraits_starovka_20261117.py
          fi
      - name: Contrôler JavaScript
        run: node --check data.js
      - name: Contrôler les dix fichiers de portrait avant commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('images/Sovarka/Starovka')
          images=sorted(p.glob('Starovka_portrait_*'))
          names=['damdin-mazoutov','bayar-otchirov','ganbold-garmaiev',
             'temur-dougarov','meneur-supporters','saran-batbayar',
             'dolgor-tsybikova','zorigto-badmaev','bair-sambuev','bair-dorjiev']
          matches={n: [x for x in images if n in x.stem] for n in names}
          for n,found in matches.items():
              assert len(found)==1,(n,found)
              with Image.open(found[0]) as im:
                  assert im.format=='WEBP' and im.size==(512,512),(n,im.size,im.format)
          text=Path('data.js').read_text()
          assert text.count('STAROVKA_PORTRAITS_MANQUANTS_20261117')==1
          assert not list(p.glob('Galerie de portraits*.png'))
          print('Contrôle 10/10 : WebP carrés, données raccordées, source supprimée')
          PY
      - name: Publier les fichiers validés sur la branche
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Aucune modification supplémentaire"; exit 0; fi
          git commit -m "Starovka: dix portraits WebP raccordés, planche PNG supprimée"
          git push origin HEAD:chatgpt/starovka-portraits-neuf-20261117
