name: "Starovka — presse en pièce unique"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '52 3 * * *'
  push:
    branches: [chatgpt/starovka-presse-commerce-unique-20261116]
    paths:
      - .github/workflows/starovka-presse-piece-unique-20261116.yml
      - outils/bancs/test-starovka-presse-piece-unique-20261116.cjs
      - data.js
      - plateau-rue-centrale.js
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check data.js
          node --check plateau-rue-centrale.js
          node outils/bancs/test-starovka-presse-piece-unique-20261116.cjs
