name: "Starovka logements collectifs — cinq WebP et raccordement"
on:
  push:
    branches:
      - chatgpt/starovka-logements-images-20261115
    paths:
      - .github/workflows/starovka-logements-images-20261115.yml
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Convertir, supprimer les PNG et raccorder la ville
        run: python outils/images/implanter_starovka_logements_20261115.py
      - name: Vérifier syntaxe, fichiers et isolation géographique
        run: |
          node --check data.js
          node - <<'NODE'
          const fs = require('node:fs'), assert=require('node:assert/strict');
          const src=fs.readFileSync('data.js','utf8');
          const p=src.indexOf('// STAROVKA_LOGEMENTS_CINQ_WEBP');
          assert.ok(p>=0);
          const s=src.slice(p,p+1700);
          for(const n of ['salle','petit_appartement_','grand_appartement_','petit_','grand_','stade','foreuses']) assert.ok(s.includes(n),n);
          assert.ok(s.includes("contexte('ville_a', 'logements-novomirsk')"));
          for(const name of ['hall','petit_stade','petit_foreuses','grand_stade','grand_foreuses']) {
            const path='images/Sovarka/Starovka/Starovka_logements_'+name+'.webp';
            assert.ok(fs.existsSync(path),path);
            const data=fs.readFileSync(path);
            assert.equal(data.toString('ascii',0,4),'RIFF');
            assert.equal(data.toString('ascii',8,12),'WEBP');
          }
          console.log('Contrôles Starovka OK');
          NODE
      - name: Commiter les cinq WebP et la surcharge
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : cinq WebP et décors des logements collectifs"
          git push origin HEAD:chatgpt/starovka-logements-images-20261115
