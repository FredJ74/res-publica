name: Krasnov — conversion PNG en WebP et tests
on:
  push:
    branches: [feat/krasnov-distillerie-ecoute-images-20261114]
    paths:
      - 'data.js'
      - 'migrations/20261114170000_krasnov_distillerie_salles.sql'
      - 'outils/bancs/test-krasnov-distillerie-ecoute-20261114.mjs'
      - '.github/workflows/krasnov-distillerie-ecoute-20261114.yml'
permissions:
  contents: write
jobs:
  conversion-et-controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir les quatre PNG téléchargés
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path('images/Sovarka/Krasnov')
          captures=sorted(folder.glob('Image ChatGPT 14 nov. 2026, 15_46_*.png'))
          assert len(captures)==3, f'Trois PNG distillerie attendus : {captures}'
          sources=[
            (captures[0],folder/'Krasnov_distillerie_salle_ventes.webp'),
            (captures[1],folder/'Krasnov_distillerie_bureau_direction.webp'),
            (captures[2],folder/'Krasnov_distillerie_atelier.webp'),
          ]
          radio=list(folder.glob('Poste d*.png'))
          assert len(radio)==1, f'PNG centre d’écoute manquant/ambigu : {radio}'
          sources.append((radio[0],folder/'Krasnov_centre_ecoute_salle.webp'))
          for src,dest in sources:
            assert not dest.exists(),f'WebP deja present: {dest}'
            with Image.open(src) as im:
              assert im.width>=1000 and im.height>=700,(src,im.size)
              im.convert('RGB').save(dest,'WEBP',quality=86,method=6)
            with Image.open(dest) as im:
              assert im.format=='WEBP'
            print(src.name,'=>',dest.name,src.stat().st_size,'=>',dest.stat().st_size)
            src.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests de données et des quatre WebP
        run: |
          node --check data.js
          node outils/bancs/test-krasnov-distillerie-ecoute-20261114.mjs
      - name: Commit des images optimisées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- images/Sovarka/Krasnov
          if ! git diff --cached --quiet; then
            git commit -m 'assets(krasnov): convertir distillerie et écoute en WebP'
            git push
          fi
