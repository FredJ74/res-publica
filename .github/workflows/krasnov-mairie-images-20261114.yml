name: Krasnov mairie conversion WebP
on:
  push:
    branches: [feat/krasnov-mairie-images-20261114]
    paths:
      - 'data.js'
      - 'migrations/20261114190000_krasnov_mairie_salle_elections.sql'
      - 'outils/bancs/test-krasnov-mairie-images-20261114.mjs'
      - '.github/workflows/krasnov-mairie-images-20261114.yml'
permissions:
  contents: write
jobs:
  conversion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir les cinq PNG et supprimer les originaux
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('images/Sovarka/Krasnov')
          source=sorted(d.glob('Image ChatGPT 14 nov. 2026, 18_15_*.png'))
          elections=[p for p in d.glob('*.png') if p.name.startswith('Bureau de vote sovi')]
          assert len(source)==4,(len(source),source)
          assert len(elections)==1,(len(elections),elections)
          names=[
            'Krasnov_mairie_accueil.webp',
            'Krasnov_mairie_bureau_adjoint.webp',
            'Krasnov_mairie_bureau_maire.webp',
            'Krasnov_mairie_salle_partis.webp'
          ]
          for p,name in [*zip(source,names),(elections[0],'Krasnov_mairie_salle_elections.webp')]:
            target=d/name
            assert not target.exists(),f'Cible existante {target}'
            with Image.open(p) as i:
              assert i.width>=1000 and i.height>=700,(p,i.size)
              i.convert('RGB').save(target,'WEBP',quality=86,method=6)
            with Image.open(target) as i:
              assert i.format=='WEBP'
            print(p.name,'=>',target.name,p.stat().st_size,'=>',target.stat().st_size)
            p.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider le code et les images
        run: |
          node --check data.js
          node outils/bancs/test-krasnov-mairie-images-20261114.mjs
      - name: Commit des images converties
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- images/Sovarka/Krasnov
          if ! git diff --cached --quiet; then
            git commit -m 'assets(krasnov): mairie, cinq salles en WebP'
            git push
          fi
