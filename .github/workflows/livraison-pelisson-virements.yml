name: Livraison Robert Pelisson et menu Virements
on:
  push:
    branches:
      - chatgpt/robert-pelisson-virements-20261104
permissions:
  contents: write
jobs:
  livrer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer le patch contrôlé depuis main
        shell: bash
        run: |
          set -euo pipefail
          base64 -d outils/livraison/banque-pelisson-virements.patch.gz.b64 | gzip -d > /tmp/pelisson-virements.patch
          git apply --check /tmp/pelisson-virements.patch
          git apply /tmp/pelisson-virements.patch
          git diff --check
          node --check data.js
          node --check plateau-core.js
          node --check plateau-router.js
          node --check plateau-justice-economie.js
          node --check api/_pnj-personnalites.js
          node --test outils/bancs/banc-virements-pelisson-20261104.cjs outils/bancs/banc-coherence-banques.cjs
      - name: Enregistrer les corrections, retirer le transport temporaire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm outils/livraison/banque-pelisson-virements.patch.gz.b64
          git rm .github/workflows/livraison-pelisson-virements.yml
          git add -A
          git diff --cached --check
          git commit -m "Banques : Robert Pelisson et menu Virements commun aux trois villes"
          git push origin HEAD:chatgpt/robert-pelisson-virements-20261104
