name: Correction enseigne résidence impériale — examen
on:
  pull_request:
    paths:
      - 'outils/images/corriger-enseigne-residence.py'
      - '.github/workflows/correction-enseigne-residence.yml'
      - 'images/rue-residences-eglise-novomirsk.webp'
permissions:
  contents: read
jobs:
  inspecter-enseigne:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python outils/images/corriger-enseigne-residence.py --inspect
