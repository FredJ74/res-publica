name: Correction enseigne résidence impériale — source jeu
on:
  pull_request:
    paths:
      - 'outils/images/corriger-enseigne-residence.py'
      - '.github/workflows/correction-enseigne-residence.yml'
      - 'images/rue-residences-eglise-novomirsk.webp'
permissions:
  contents: write
jobs:
  corriger-enseigne:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - run: python -m pip install --disable-pip-version-check pillow opencv-python-headless
      - name: Retoucher le WebP original et pousser la source modifiée
        run: |
          source='images/rue-residences-eglise-novomirsk.webp'
          if [ "$(git hash-object "$source")" = 'fdbb8059497dbade335e0695a0f7431dd7bee361' ]; then
            python outils/images/corriger-enseigne-residence.py --apply
            git add "$source"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(art): RÉSIDENCE IMPÉRIALE sur la rue V7 de Novomirsk'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo 'Source corrigée ou version inattendue : aucun réencodage supplémentaire.'
          fi
      - name: Inspecter la plaque dans la source issue du changement
        run: python outils/images/corriger-enseigne-residence.py --inspect
