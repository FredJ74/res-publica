name: Starovka — convertir rue pétrole-ferme et contrôler le raccordement
on:
  push:
    branches: [feature/starovka-petrole-ferme-20261106]
    paths:
      - '.github/workflows/starovka-petrole-ferme-20261106.yml'
      - 'outils/bancs/test-starovka-rue-petrole-ferme-20261106.mjs'
permissions:
  contents: write
jobs:
  conversion-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir la seule rue pétrole-ferme, vérifier et retirer le PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps
          p=Path('images/Sovarka/Starovka/Starovka_rue_pétrole_ferme.png')
          w=p.with_suffix('.webp')
          assert p.is_file(), 'PNG source absent'
          assert not w.exists(), 'WebP cible préexistant : refus de remplacer'
          with Image.open(p) as im:
              rgb=ImageOps.exif_transpose(im).convert('RGB')
              size=rgb.size
              rgb.save(w,'WEBP',quality=85,method=6)
          with Image.open(w) as im:
              assert im.format=='WEBP' and im.size==size
              im.verify()
          assert w.stat().st_size>100
          p.unlink()
          assert not p.exists()
          print('WEBP validé',w.name,w.stat().st_size,'dimensions',size)
          PY
      - name: Vérifications ciblées et syntaxe
        run: |
          node --check plateau-rue-centrale.js
          node --test outils/bancs/test-starovka-rue-petrole-ferme-20261106.mjs outils/bancs/test-starovka-hall-hotel-ferme-20261105.mjs
          git diff --check
      - name: Publier conversion sur la branche
        run: |
          git add -A -- images/Sovarka/Starovka/Starovka_rue_pétrole_ferme.png images/Sovarka/Starovka/Starovka_rue_pétrole_ferme.webp
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(starovka): convertir pétrole-ferme en WebP et supprimer PNG'
          git push origin HEAD:feature/starovka-petrole-ferme-20261106
