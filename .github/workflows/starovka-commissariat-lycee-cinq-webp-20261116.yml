name: "Starovka — commissariat et lycée, cinq WebP"
on:
  push:
    branches: [chatgpt/starovka-commissariat-lycee-cinq-webp-20261116]
    paths:
      - .github/workflows/starovka-commissariat-lycee-cinq-webp-20261116.yml
      - outils/images/implanter_starovka_commissariat_lycee_20261116.py
      - outils/bancs/test-starovka-commissariat-lycee-20261116.cjs
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Convertir et raccorder les cinq images
        run: python outils/images/implanter_starovka_commissariat_lycee_20261116.py
      - name: Vérifier les décors, PNJ et fonctions conservées
        run: |
          node --check data.js
          node outils/bancs/test-starovka-commissariat-lycee-20261116.cjs
      - name: Envoyer les cinq WebP et supprimer les PNG
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : cinq décors WebP commissariat et lycée"
          git push origin HEAD:chatgpt/starovka-commissariat-lycee-cinq-webp-20261116
