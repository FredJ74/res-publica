name: Aide — diagnostic de régression visuelle
on:
  pull_request:
    paths:
      - 'outils/diagnostics/aide-diff-visuel.cjs'
      - '.github/workflows/aide-diagnostic-visuel.yml'
permissions:
  contents: read
jobs:
  inspecter:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install Pillow==11.3.0
      - run: node outils/diagnostics/aide-diff-visuel.cjs
      - name: Comparer les pixels du bureau et du forum
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          d=Path('/tmp/hg-aide-visuel')
          for nom in ('','forum-'):
              avant=Image.open(d/(nom+'avant.png')).convert('RGB')
              apres=Image.open(d/(nom+'apres.png')).convert('RGB')
              delta=ImageChops.difference(avant,apres)
              bbox=delta.getbbox()
              if bbox:
                  px=sum(1 for p in delta.getdata() if p!=(0,0,0))
                  print(f'{nom or "plateau"}: différences={px}, emprise={bbox}, total={avant.width*avant.height}')
              else:
                  print(f'{nom or "plateau"}: images identiques')
          PY
