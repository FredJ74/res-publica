name: Novomirsk - Grand Hotel quatre images WebP
on:
  push:
    branches:
      - chatgpt/novomirsk-grand-hotel-4-webp-20261106
    paths:
      - .github/workflows/novomirsk-grand-hotel-convert-20261106.yml
  pull_request:
    paths:
      - .github/workflows/novomirsk-grand-hotel-convert-20261106.yml
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/novomirsk-grand-hotel-4-webp-20261106
          persist-credentials: true
      - name: Convertir exactement les 4 PNG existants
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          base=Path('images/Sovarka/Novomirsk')
          pairs={
            'Novomirsk_Grand Hotel_reception.png':'Novomirsk_Grand_Hotel_reception.webp',
            'Novomirsk_Grand Hotel_bar.png':'Novomirsk_Grand_Hotel_bar.webp',
            'Novomirsk_Grand Hotel_Restaurant.png':'Novomirsk_Grand_Hotel_restaurant.webp',
            'Novomirsk_Grand Hotel_chambre.png':'Novomirsk_Grand_Hotel_chambre.webp',
          }
          for original,converted in pairs.items():
            src=base/original
            dst=base/converted
            if not src.is_file(): raise SystemExit('PNG non trouvé: '+str(src))
            if dst.exists(): raise SystemExit('Destination déjà existante: '+str(dst))
            with Image.open(src) as im:
              if im.format!='PNG' or im.width<900 or im.height<600:
                raise SystemExit('PNG non conforme: '+str(src))
              dimension=im.size
              im.convert('RGB').save(dst,'WEBP',quality=85,method=6)
            with Image.open(dst) as out:
              if out.format!='WEBP' or out.size!=dimension:
                raise SystemExit('Conversion défectueuse: '+str(dst))
              out.verify()
            if dst.stat().st_size < 100000:
              raise SystemExit('Fichier trop petit: '+str(dst))
            print(original,'->',converted,'taille',dst.stat().st_size,'sha256',hashlib.sha256(dst.read_bytes()).hexdigest())
            src.unlink()
          assert len(list(base.glob('Novomirsk_Grand_Hotel_*.webp'))) >= 4
          PY
      - name: Tests des images, salles et ordres
        run: |
          node --check data.js
          node --test outils/bancs/test-novomirsk-grand-hotel-4-webp-20261106.mjs
          node --test outils/bancs/test-novomirsk-commissariat-notaire-portraits-20261106.mjs
          git diff --check
      - name: Commit conversion sur la branche de travail
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/Sovarka/Novomirsk
          git diff --cached --stat
          git commit -m "assets(novomirsk): Grand Hotel quatre WebP, PNG supprimes"
          git push origin HEAD:refs/heads/chatgpt/novomirsk-grand-hotel-4-webp-20261106
