name: i18n — registre état civil
on:
  pull_request:
    paths:
      - 'i18n/civil-registry-resources.js'
      - 'plateau-etat-civil.js'
      - 'plateau.html'
      - 'outils/audits/audit-i18n-editorial.cjs'
      - 'outils/bancs/banc-i18n-etat-civil-20261112.cjs'
      - '.github/workflows/i18n-etat-civil.yml'
permissions:
  contents: read
jobs:
  registre:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        run: node --check plateau-etat-civil.js && node --check i18n/civil-registry-resources.js
      - name: Tester les neuf langues et l'intégrité
        run: node --test outils/bancs/banc-i18n-etat-civil-20261112.cjs
      - name: Audit éditorial global
        run: node outils/audits/audit-i18n-editorial.cjs > /tmp/audit-i18n-editorial.json
      - run: git diff --check
