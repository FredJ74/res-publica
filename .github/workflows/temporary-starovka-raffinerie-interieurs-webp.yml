name: Temporaire - WebP des trois intérieurs de raffinerie Starovka
on:
  push:
    branches:
      - chatgpt/starovka-raffinerie-interieurs-20261115
permissions:
  contents: write
jobs:
  convertir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Convertir et supprimer les trois PNG
        run: python outils/images/convertir_starovka_raffinerie_interieurs_20261115.py
      - name: Vérifier les trois scènes
        run: node outils/bancs/banc-starovka-raffinerie-interieurs-20261115.cjs
      - name: Commit des images
        shell: bash
        run: |
          set -euo pipefail
          git add -A images/Sovarka/Starovka
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(starovka): trois WebP VP8 de la raffinerie, PNG supprimes'
            git push origin HEAD:chatgpt/starovka-raffinerie-interieurs-20261115
          fi
