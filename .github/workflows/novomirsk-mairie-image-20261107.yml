name: Convertir la rue de la mairie de Novomirsk en WebP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/novomirsk-mairie-image-20261107.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir et remplacer l'image de rue
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('images/Sovarka/Novomirsk/Novomirsk_rue mairie coiffeur.png')
          destination = Path('images/rue-salon-coiffure-novomirsk.webp')
          if not source.is_file():
              raise SystemExit(f'Image source absente: {source}')
          with Image.open(source) as image:
              image.convert('RGB').save(destination, 'WEBP', quality=94, method=6)
          with Image.open(destination) as image:
              assert image.format == 'WEBP', 'Format WebP invalide'
              print(f'{destination}: {image.size}')
          source.unlink()
          PY
          git add 'images/rue-salon-coiffure-novomirsk.webp' 'images/Sovarka/Novomirsk/Novomirsk_rue mairie coiffeur.png'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Novomirsk : remplacer la rue du salon par la mairie en WebP'
            git push
          fi
