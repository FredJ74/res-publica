name: i18n — chantier naval de PSM
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '28 3 * * *'
  pull_request:
    paths:
      - 'plateau-naval.js'
      - 'i18n/naval-resources.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-naval-20261112.cjs'
      - '.github/workflows/i18n-naval.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  naval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plateau-naval.js && node --check i18n/naval-resources.js
      - run: node --test outils/bancs/banc-i18n-naval-20261112.cjs
      - run: git diff --check
