name: Pavillon des Ambassadeurs Novomirsk — images WebP
on:
  pull_request:
    paths:
      - 'outils/images/integrer-pavillon-novomirsk.py'
      - '.github/workflows/pavillon-images-novomirsk.yml'
permissions:
  contents: write
jobs:
  convertir-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pillow numpy
      - name: Convertir, vérifier, intégrer puis seulement supprimer les PNG
        shell: bash
        run: |
          if git ls-files --error-unmatch 'images/Sovarka/Novomirsk/Novomirsk_pavillon ambassadeurs_hall.png' > /dev/null 2>&1; then
            python outils/images/integrer-pavillon-novomirsk.py
            git add data.js images/Sovarka/Novomirsk
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'art(sovarka): intégrer cinq vues du Pavillon des Ambassadeurs en WebP'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo 'PNG déjà convertis ; contrôle des sorties'
            test "$(git ls-files 'images/Sovarka/Novomirsk/Novomirsk_pavillon_ambassadeurs_*.webp' | wc -l)" -eq 5
          fi
      - run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          txt=Path('data.js').read_text(encoding='utf8')
          for name in ('hall','salle_reception','suite_presidentielle','suite_privee','suite_parti'):
              src=Path('images/Sovarka/Novomirsk/Novomirsk_pavillon_ambassadeurs_'+name+'.webp')
              assert src.exists(),str(src)
              with Image.open(src) as im:
                  im.verify()
              assert 'imageUrl: \'images/Sovarka/Novomirsk/'+src.name+'\'' in txt,src.name
          print('5/5 WebP décodables et liés dans data.js')
          PY
