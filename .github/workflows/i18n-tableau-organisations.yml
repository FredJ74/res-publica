name: Organisations — langues, formulaires et confidentialité
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '41 3 * * *'
  pull_request:
    paths: ['plateau-organisations-quetes.js', 'plateau-personnage.js', 'plateau.html', 'i18n/organization-directory-resources.js', 'i18n/organization-creation-resources.js', 'i18n/organization-members-resources.js', 'i18n/organization-admissions-resources.js', 'i18n/organization-settings-resources.js', 'i18n/organization-panel-resources.js', 'i18n/plateau-init.js', 'outils/bancs/*tableau-organisations*', 'outils/bancs/*creation-organisation*', 'outils/bancs/*membres-organisations*', 'outils/bancs/*adhesions-organisations*', 'outils/bancs/*parametres-organisations*', 'outils/bancs/*onglet-organisations*', '.github/workflows/i18n-tableau-organisations.yml', 'data.js', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
  push:
    branches: [main]
    paths: ['plateau-organisations-quetes.js', 'plateau-personnage.js', 'i18n/organization-directory-resources.js', 'i18n/organization-creation-resources.js', 'i18n/organization-members-resources.js', 'i18n/organization-admissions-resources.js', 'i18n/organization-settings-resources.js', 'i18n/organization-panel-resources.js', 'outils/bancs/*tableau-organisations*', 'outils/bancs/*creation-organisation*', 'outils/bancs/*membres-organisations*', 'outils/bancs/*adhesions-organisations*', 'outils/bancs/*parametres-organisations*', 'outils/bancs/*onglet-organisations*', '.github/workflows/i18n-tableau-organisations.yml', 'data.js', 'plateau-core.js', 'plateau-router.js', 'migrations/**', '.github/workflows/**', 'i18n/**', 'auth.js', 'supabase.js', 'sens-saisie.js', 'style.css', 'rue-centrale.css', 'vercel.json']
permissions:
  contents: read
jobs:
  organisations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix outils/audits/i18n-global
      - run: npm ci --ignore-scripts --prefix outils/e2e
      - run: npm ci --ignore-scripts --prefix outils/vercel
      - name: Français et neuf langues, AST métier et anciens bancs des organisations
        run: node --test outils/bancs/banc-i18n-onglet-organisations-20261114.cjs outils/bancs/banc-i18n-parametres-organisations-20261114.cjs outils/bancs/banc-i18n-adhesions-organisations-20261114.cjs outils/bancs/banc-i18n-membres-organisations-20261114.cjs outils/bancs/banc-i18n-creation-organisation-20261114.cjs outils/bancs/banc-i18n-tableau-organisations-20261114.cjs outils/bancs/banc-audit-i18n-global.cjs outils/bancs/banc-i18n-editorial.cjs outils/bancs/banc-i18n-bookmaker.cjs outils/bancs/banc-i18n-catalogue-ordres.cjs outils/bancs/banc-organisations-activation-client.cjs outils/bancs/banc-organisations-commandes-client.cjs outils/bancs/banc-organisations-membres-client.cjs outils/bancs/banc-organisations-evenements-client.cjs outils/bancs/banc-coherence-organisations.cjs outils/bancs/banc-rumeur-organisations-secretes.cjs
      - name: Chromium — onglet 1134, paramètres 432, adhésions/invitations 513, membres 243, formulaires 756 bascules, tableau 999 bascules, 320/390/1280, RTL, secrets, position, noms et zéro dépense
        env:
          NODE_PATH: ./outils/e2e/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test outils/bancs/banc-i18n-onglet-organisations-navigateur-20261114.cjs outils/bancs/banc-i18n-parametres-organisations-navigateur-20261114.cjs outils/bancs/banc-i18n-adhesions-organisations-navigateur-20261114.cjs outils/bancs/banc-i18n-membres-organisations-navigateur-20261114.cjs outils/bancs/banc-i18n-creation-organisation-navigateur-20261114.cjs outils/bancs/banc-i18n-tableau-organisations-navigateur-20261114.cjs
