name: "Krasnov : 17 portraits WebP et raccordement"
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "outils/images/decouper_portraits_krasnov_20261117.py"
      - ".github/workflows/krasnov-17-portraits-20261117.yml"
      - "data.js"
      - "images/Sovarka/Krasnov/**"
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Récupérer le lot de 17 portraits quand il est ajouté à main
        run: |
          if ! grep -q 'KRASNOV_PORTRAITS_MANQUANTS_20261117' data.js; then
            git fetch origin main --depth=1
            target="images/Sovarka/Krasnov/Krasnov_17_portraits_WebP.zip"
            if [[ ! -f "$target" ]]; then
              git show "origin/main:$target" > "$target" 2>/dev/null || rm -f "$target"
            fi
          fi
      - name: Valider la syntaxe du générateur
        run: python -m py_compile outils/images/decouper_portraits_krasnov_20261117.py
      - name: Découper exclusivement la planche validée
        run: |
          if grep -q 'KRASNOV_PORTRAITS_MANQUANTS_20261117' data.js; then
            echo "Déjà produit et raccordé : contrôle idempotent"
          else
            python outils/images/decouper_portraits_krasnov_20261117.py
          fi
      - name: Vérifier 17 WebP, noms et suppression des anciennes planches
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('images/Sovarka/Krasnov')
          names=['le-maire','fiodor-doznaiev','egor-tikhonov','anatoli-gromov',
              'platon-iermakov','varvara-kozlova','efim-iakovlev','stas-mironov',
              'valentina-makhorkina','stiopa-ossipov','fiodor-kolkhozov',
              'stepan-kouznetsov','antonina-merkoulova','matvei-rybakov',
              'galina-belova','anatoli-pokhmelkine','vassili-gradousov']
          all_files=list(p.glob('Krasnov_portrait_*.webp'))
          for name in names:
              found=[q for q in all_files if q.stem.endswith('_'+name)]
              assert len(found)==1,(name,found)
              with Image.open(found[0]) as image:
                  assert image.format=='WEBP' and image.size==(512,512),found[0]
          assert not list(p.glob('Galerie des personnages de Krasnov*.png'))
          assert not list(p.glob('Grille de portraits du village*.png'))
          assert not (p/'Krasnov_17_portraits_WebP.zip').exists()
          text=Path('data.js').read_text()
          assert text.count('KRASNOV_PORTRAITS_MANQUANTS_20261117')==1
          for stable in ['Praskovia.webp','Kouzma.webp','Krasnov_stade_entraineur_portrait.webp']:
              assert stable in text,stable
          print('OK: 17 WebP 512x512, source supprimée, anciens portraits préservés')
          PY
      - name: Syntaxe et chargement des villes
        run: |
          node --check data.js
          node --test outils/bancs/test-krasnov-accueil-sans-vide-20261115.mjs
          node --test outils/bancs/test-starovka-rue-petrole-ferme-20261106.mjs
      - name: Publier les WebP et le raccord sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Krasnov
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Déjà publié"; exit 0; fi
          git commit -m "Krasnov : 17 nouveaux portraits WebP sans doublon ni Ignat"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
