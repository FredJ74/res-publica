name: Krasnov - eglise et maison Kouzma WebP
on:
  push:
    branches:
      - chatgpt/krasnov-eglise-maison-kouzma-images-20261115
    paths:
      - '.github/workflows/krasnov-eglise-maison-kouzma-webp-20261115.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir deux images de Fred et supprimer les PNG originaux
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import unicodedata
          source=Path('images')
          dest=source/'Sovarka'/'Krasnov'
          mapping={
            'interieur chaleureux d une maison orthodoxe russe':'Krasnov_maison_kouzma_interieur.webp',
            'interieur orthodoxe dore et solennel':'Krasnov_eglise_sainte_moisson_interieur.webp',
          }
          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode('ascii').lower()
              s=s.replace('’',' ').replace("'",' ')
              return ' '.join(s.split())
          candidates=[p for p in source.iterdir() if p.is_file() and p.suffix.lower()=='.png']
          for key,name in mapping.items():
              matches=[p for p in candidates if norm(p.stem)==key]
              assert len(matches)==1,(key,[str(x) for x in matches])
              src=matches[0]
              dst=dest/name
              assert not dst.exists(),f'WebP deja present : {dst}'
              with Image.open(src) as image:
                  image.load()
                  assert image.width>=1200 and image.height>=900,(str(src),image.size)
                  image.convert('RGB').save(dst,'WEBP',quality=85,method=6,lossless=False)
                  size=image.size
              with Image.open(dst) as check:
                  check.load()
                  assert check.format=='WEBP' and check.size==size
              data=dst.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP' and data[12:16]==b'VP8 ', name
              assert 50000<dst.stat().st_size<src.stat().st_size, (dst.stat().st_size, src.stat().st_size)
              print(src.name,'->',dst.as_posix(),dst.stat().st_size)
              src.unlink()
          assert all((dest/name).is_file() for name in mapping.values())
          assert not any(norm(p.stem) in mapping for p in source.glob('*.png'))
          assert any('portrait' in norm(p.stem) for p in source.glob('*.png')),'Portraits PNJ intacts'
          PY
      - name: Vérifier les branchements de scène
        run: |
          node --test outils/bancs/test-krasnov-eglise-maison-kouzma-images-20261115.mjs
          git diff --check
      - name: Commit des WebP et des suppressions sur la branche
        run: |
          git add images
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Krasnov : eglise et maison de Kouzma, deux WebP avec perte'
            git push origin HEAD:chatgpt/krasnov-eglise-maison-kouzma-images-20261115
          fi
