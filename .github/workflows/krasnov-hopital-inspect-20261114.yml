name: Krasnov inspecter le PNG d'hopital
on:
  push:
    branches: [fix/krasnov-hopital-depuis-bureaux-20261114]
    paths:
      - '.github/workflows/krasnov-hopital-inspect-20261114.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io
          a=list(Path('images/Sovarka/Krasnov').glob('*[Hh]o*pital*.png'))
          print('SOURCE CANDIDATES:',[str(x) for x in a])
          assert len(a)==1
          with Image.open(a[0]) as i:
            print('IMAGE FORMAT',i.format,'SIZE',i.size)
            i.thumbnail((640,450))
            b=io.BytesIO()
            i.convert('RGB').save(b,format='JPEG',quality=66)
            print('THUMB_BEGIN')
            print(base64.b64encode(b.getvalue()).decode())
            print('THUMB_END')
          PY
