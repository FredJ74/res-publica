name: "Starovka — six WebP marché et mairie"
on:
  push:
    branches: [chatgpt/starovka-marche-mairie-six-webp-20261116]
    paths:
      - .github/workflows/starovka-marche-mairie-six-webp-20261116.yml
      - outils/images/implanter_starovka_marche_mairie_20261116.py
      - outils/bancs/test-starovka-marche-mairie-20261116.cjs
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Convertir et raccorder les six décors de Starovka
        run: python outils/images/implanter_starovka_marche_mairie_20261116.py
      - name: Tester les pièces et les images
        run: |
          node --check data.js
          node outils/bancs/test-starovka-marche-mairie-20261116.cjs
      - name: Commiter les WebP et la suppression des PNG
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : six images mairie et marché converties en WebP"
          git push origin HEAD:chatgpt/starovka-marche-mairie-six-webp-20261116
