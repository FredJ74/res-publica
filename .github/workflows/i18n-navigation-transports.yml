name: I18N — Plans et transports (9 langues)
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '33 3 * * *'
  pull_request:
    paths:
      - 'i18n/navigation-resources.js'
      - 'plateau-navigation.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-navigation-transports.cjs'
      - '.github/workflows/i18n-navigation-transports.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  push:
    paths:
      - 'i18n/navigation-resources.js'
      - 'plateau-navigation.js'
      - 'plateau.html'
      - 'outils/bancs/banc-i18n-navigation-transports.cjs'
      - '.github/workflows/i18n-navigation-transports.yml'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check i18n/navigation-resources.js
          node --check plateau-navigation.js
          node --check outils/bancs/banc-i18n-navigation-transports.cjs
      - run: node --test outils/bancs/banc-i18n-navigation-transports.cjs
