name: Temporaire - convertir les deux rues Starovka en WebP
on:
  push:
    branches:
      - chatgpt/starovka-hopital-tribunal-artisanal-20261115
permissions:
  contents: write
jobs:
  convertir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Convertir et supprimer les deux PNG
        run: python outils/images/convertir_starovka_rues_20261115.py
      - name: Vérifier la navigation et le format des images
        run: node outils/bancs/banc-starovka-rues-hopital-tribunal-20261115.cjs
      - name: Commit de la conversion
        shell: bash
        run: |
          set -euo pipefail
          git add -A images/Sovarka/Starovka
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(starovka): deux WebP VP8 qualite 85 et PNG retires'
            git push origin HEAD:chatgpt/starovka-hopital-tribunal-artisanal-20261115
          fi
