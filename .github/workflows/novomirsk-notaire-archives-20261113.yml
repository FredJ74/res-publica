name: "Novomirsk - archives notariales : PNG vers WebP"
on:
  push:
    branches:
      - chatgpt/novomirsk-notaire-archives-final-20261113
    paths:
      - .github/workflows/novomirsk-notaire-archives-20261113.yml
permissions:
  contents: write
jobs:
  convertir-et-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Pillow
        run: python -m pip install Pillow
      - name: Convertir, valider et supprimer le PNG original
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          dossier = Path('images/Sovarka/Novomirsk')
          source = dossier / 'Novomirsk_notaire_Archives.png'
          cible = dossier / 'Novomirsk_notaire_archives.webp'
          assert source.is_file(), f'Image source absente : {source}'
          assert not cible.exists(), f'Cible WebP déjà présente : {cible}'
          with Image.open(source) as image:
              assert image.width >= 1000 and image.height >= 600, 'Image de résolution insuffisante'
              image.convert('RGB').save(cible, 'WEBP', quality=85, method=6)
          with Image.open(cible) as control:
              assert control.format == 'WEBP'
              assert control.width >= 1000 and control.height >= 600
              print(f'WebP vérifié : {control.size}, {cible.stat().st_size} octets')
          source.unlink()
          assert not source.exists()
          PY
      - name: Vérifier la salle et conserver les autres salles
        run: |
          node --check data.js
          node - <<'NODE'
          const fs = require('node:fs'), vm = require('node:vm'), assert = require('node:assert/strict');
          const ctx = { console }; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8')+';this.B=BUILDINGS;this.W=WORLD;', ctx);
          const override = ctx.W.soviet.capitale.buildingContext['office-notarial'].roomOverrides;
          const attendu = 'images/Sovarka/Novomirsk/Novomirsk_notaire_archives.webp';
          assert.equal(override.archives_notariales.imageUrl, attendu);
          const img = fs.readFileSync(attendu);
          assert.equal(img.subarray(0,4).toString(),'RIFF');
          assert.equal(img.subarray(8,12).toString(),'WEBP');
          assert.equal(fs.existsSync('images/Sovarka/Novomirsk/Novomirsk_notaire_Archives.png'), false);
          for (const id of ['accueil_notaire','bureau_successions','bureau_contrats']) {
            assert.ok(override[id]?.imageUrl?.endsWith('.webp'), id);
            assert.ok(fs.existsSync(override[id].imageUrl), id);
          }
          assert.ok(ctx.B['office-notarial'].rooms.archives_notariales.orders.some(o=>o.fn==='consulter_archives_notariales'));
          console.log('Archives raccordées, autres pièces intactes et ordre de consultation préservé.');
          NODE
      - name: Enregistrer la conversion dans la branche
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/Sovarka/Novomirsk/Novomirsk_notaire_Archives.png images/Sovarka/Novomirsk/Novomirsk_notaire_archives.webp
          git diff --cached --check
          git commit -m "Novomirsk : convertir les archives notariales en WebP et retirer le PNG"
          git push origin HEAD:chatgpt/novomirsk-notaire-archives-final-20261113
