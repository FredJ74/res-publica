name: Cohérence client et transactions locales

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Annuler seulement les executions perimees d'une meme PR ; main reste integral.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bancs-hors-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe des fonctions API, sans appel distant
        run: python3 outils/bancs/verifier-syntaxe-api.py
      - name: Calendrier sur main (PR couvertes par les controles dedies)
        if: github.event_name == 'push'
        run: node --test outils/bancs/test-*.mjs
      - name: Constructeur Vercel épinglé pour la régression de chargement
        run: npm ci --prefix outils/vercel --no-audit --no-fund
      - name: Installer les dépendances du pilote navigateur avant les bancs client
        run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - name: Bancs JavaScript, transports simulés
        run: python3 outils/bancs/controler-client.py --rapport /tmp/hg-bancs
      - name: Pilote joueur, fixtures locales sans compte ni Supabase
        run: npm test --prefix outils/e2e
      - name: Dépendances du PostgreSQL jetable
        run: python3 -m pip install -r outils/bancs/requirements-postgres-local.txt
      - name: Audit Arnie sur PostgreSQL jetable, aucune identite reelle
        run: python3 outils/e2e/test-prevol-arnie-local.py --local-jetable
      - name: Achat sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-achat-commerce-local.py --local-jetable
      - name: Restaurant gastronomique sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-restaurant-luthecia-local.py --local-jetable --correctif-reservation
      - name: Reservation Republica, accueil et persistance atomique hors production
        run: python3 outils/bancs/banc-reservation-republica-local.py --local-jetable
      - name: Catalogue et tournée sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-offrir-boire-local.py --local-jetable
      - name: Réception atomique sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-reception-atomique-local.py --local-jetable
      - name: Assemblage electronique sur PostgreSQL local
        run: python3 outils/bancs/banc-assemblage-electronique-local.py
      - name: Publications Jodie sur PostgreSQL local
        run: python3 outils/bancs/banc-jodie-publications-local.py
      - name: Commandes administratives organisations sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-commandes-local.py
      - name: Adhesions et grades organisations sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-membres-local.py
      - name: Invitations et elections avec paiement reel sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-evenements-local.py
      - name: Coherence rues et sorties sur PostgreSQL local
        run: python3 outils/bancs/banc-coherence-rues-local.py
      - name: Equipements collectifs sur PostgreSQL local
        run: python3 outils/bancs/banc-equipements-collectifs-local.py
      - name: Placements nationaux atomiques et idempotents sur PostgreSQL local
        run: python3 outils/bancs/banc-placement-national-local.py
      - name: Journal des ventes prive, PostgreSQL jetable
        run: python3 outils/bancs/banc-journal-ventes-local.py
      - name: Conserver les résultats des bancs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancs-client
          path: /tmp/hg-bancs
