name: Cohérence client et transactions locales

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Annuler seulement les executions perimees d'une meme PR ; main reste integral.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bancs-hors-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe des fonctions API, sans appel distant
        run: python3 outils/bancs/verifier-syntaxe-api.py
      - name: Calendrier sur main (PR couvertes par les controles dedies)
        if: github.event_name == 'push'
        run: node --test outils/bancs/test-*.mjs
      - name: Constructeur Vercel épinglé pour la régression de chargement
        run: npm ci --prefix outils/vercel --no-audit --no-fund
      - name: Installer les dépendances du pilote navigateur avant les bancs client
        run: npm ci --prefix outils/e2e --ignore-scripts --no-audit --no-fund
      - name: Bancs JavaScript, transports simulés
        run: python3 outils/bancs/controler-client.py --rapport /tmp/hg-bancs
      - name: Pilote joueur, fixtures locales sans compte ni Supabase
        run: npm test --prefix outils/e2e
      - name: Dépendances du PostgreSQL jetable
        run: python3 -m pip install -r outils/bancs/requirements-postgres-local.txt
      - name: Audit Arnie sur PostgreSQL jetable, aucune identite reelle
        run: python3 outils/e2e/test-prevol-arnie-local.py --local-jetable
      - name: Achat sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-achat-commerce-local.py --local-jetable
      - name: Restaurant gastronomique sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-restaurant-luthecia-local.py --local-jetable --correctif-reservation
      - name: Reservation Republica, accueil et persistance atomique hors production
        run: python3 outils/bancs/banc-reservation-republica-local.py --local-jetable
      - name: Catalogue et tournée sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-offrir-boire-local.py --local-jetable
      - name: Réception atomique sur PostgreSQL local, sans identifiant Supabase
        run: python3 outils/bancs/banc-reception-atomique-local.py --local-jetable
      - name: Assemblage electronique sur PostgreSQL local
        run: python3 outils/bancs/banc-assemblage-electronique-local.py
      - name: Publications Jodie sur PostgreSQL local
        run: python3 outils/bancs/banc-jodie-publications-local.py
      - name: Commandes administratives organisations sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-commandes-local.py
      - name: Adhesions et grades organisations sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-membres-local.py
      - name: Invitations et elections avec paiement reel sur PostgreSQL local
        run: python3 outils/bancs/banc-organisations-evenements-local.py
      - name: Coherence rues et sorties sur PostgreSQL local
        run: python3 outils/bancs/banc-coherence-rues-local.py
      - name: Equipements collectifs sur PostgreSQL local
        run: python3 outils/bancs/banc-equipements-collectifs-local.py
      - name: Fontaine de chocolat, garde serveur sur PostgreSQL jetable
        run: python3 outils/bancs/banc-fontaine-110-local.py
      - name: Placements nationaux atomiques et idempotents sur PostgreSQL local
        run: python3 outils/bancs/banc-placement-national-local.py
      - name: Journal des ventes prive, PostgreSQL jetable
        run: python3 outils/bancs/banc-journal-ventes-local.py
      - name: Depot de permis indivisible sur PostgreSQL local
        run: python3 outils/bancs/banc-permis-depot-local.py
      - name: Negociation des squatteurs atomique sur PostgreSQL local
        run: python3 outils/bancs/banc-negociation-squatteurs-local.py
      - name: Achat Ced atomique et quota football au jour commun sur PostgreSQL local
        run: python3 outils/bancs/banc-ced-football-local.py
      - name: Occupation persistante des terrains sur PostgreSQL local
        run: python3 outils/bancs/banc-terrain-occupation-local.py
      - name: Construction et materiaux atomiques sur PostgreSQL local
        run: |
          python3 outils/bancs/banc-construction-jour-local.py
          python3 outils/bancs/banc-construction-materiaux-local.py
          python3 outils/bancs/banc-construction-travailleur-local.py
          python3 outils/bancs/banc-reamenagement-transactionnel-local.py
          python3 outils/bancs/banc-reamenagement-quotas-local.py
          python3 outils/bancs/banc-reamenagement-budget-local.py
          python3 outils/bancs/banc-reamenagement-materiaux-local.py
          python3 outils/bancs/banc-lots-miroirs-local.py
          python3 outils/bancs/banc-occupation-actions-135-local.py
          python3 outils/bancs/banc-terrain-banque-135-local.py
          python3 outils/bancs/banc-terrain-banque-135-local.py --apres-location
          python3 outils/bancs/banc-parcours-terrain-construction-135-local.py
          python3 outils/bancs/contre-epreuves-parcours-terrain-135-local.py
          python3 outils/bancs/banc-benediction-135-local.py
          python3 outils/bancs/banc-filature-benediction-135-local.py
          python3 outils/bancs/banc-filature-confirmation-135-local.py
          python3 outils/bancs/contre-epreuves-filature-confirmation-135-local.py
          python3 outils/bancs/banc-vol-chantier-135-local.py
          python3 outils/bancs/banc-arme-clandestine-135-local.py
          python3 outils/bancs/contre-epreuves-arme-clandestine-135-local.py
          python3 outils/bancs/contre-epreuves-vol-chantier-135-local.py
          python3 outils/bancs/banc-enquete-confirmation-135-local.py
          python3 outils/bancs/banc-enquete-benediction-135-local.py
          python3 outils/bancs/contre-epreuves-enquete-135-local.py
          python3 outils/bancs/banc-chasse-benediction-135-local.py
          python3 outils/bancs/banc-chasse-asile-135-local.py
          python3 outils/bancs/banc-benediction-inter-hotes-135-local.py
          python3 outils/bancs/contre-epreuves-chasse-135-local.py
          python3 outils/bancs/contre-epreuves-filature-135-local.py
          python3 outils/bancs/contre-epreuves-terrain-banque-135-local.py
          python3 outils/bancs/banc-location-lot-transactionnelle-local.py
      - name: Conserver les résultats des bancs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancs-client
          path: /tmp/hg-bancs

