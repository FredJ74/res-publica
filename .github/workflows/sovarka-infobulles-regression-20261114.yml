name: Sovarka - controle des descriptions et des ordres i18n
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '16 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sovarka-infobulles-regression-20261114.yml'
      - 'i18n/sovarka-infobulles-resources.js'
      - 'outils/bancs/test-i18n-infobulles-communes-20261113.mjs'
      - 'outils/bancs/test-i18n-sovarka-infobulles-20261113.mjs'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  pull_request:
    paths:
      - 'i18n/sovarka-infobulles-resources.js'
      - 'outils/bancs/test-i18n-infobulles-communes-20261113.mjs'
      - 'outils/bancs/test-i18n-sovarka-infobulles-20261113.mjs'
      - 'data.js'
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe
        run: |
          node --check data.js
          node --check i18n/sovarka-infobulles-resources.js
      - name: Inventaire, traductions, montants et non-regressions
        run: |
          node --test outils/bancs/test-i18n-infobulles-communes-20261113.mjs outils/bancs/test-i18n-sovarka-infobulles-20261113.mjs
      - name: Diff propre
        run: git diff --check
