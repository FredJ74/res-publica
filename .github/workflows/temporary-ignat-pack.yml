name: Temporaire — régénérer paquet i18n Ignat
on:
  push:
    branches:
      - chatgpt/krasnov-maison-ignat-20261115
permissions:
  contents: write
jobs:
  regenerer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer les paquets de transport i18n
        run: node outils/generateurs/compresser-catalogues-i18n.cjs
      - name: Valider et publier les seuls fichiers régénérés
        shell: bash
        run: |
          set -euo pipefail
          node outils/generateurs/compresser-catalogues-i18n.cjs --check
          git add i18n/packed/sovarka-descriptions-resources.js.br outils/audits/I18N-CATALOGUES-TRANSPORT.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(i18n): actualiser le paquet Brotli après ajout Ignat"
            git push origin HEAD:chatgpt/krasnov-maison-ignat-20261115
          fi
