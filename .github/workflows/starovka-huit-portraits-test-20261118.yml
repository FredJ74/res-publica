name: Starovka — huit portraits individuels WebP
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '34 3 * * *'
  push:
    branches: [chatgpt/starovka-huit-portraits-20261118]
    paths:
      - data.js
      - images/Sovarka/Starovka/**
      - outils/bancs/banc-starovka-huit-portraits-20261118.cjs
      - .github/workflows/starovka-huit-portraits-test-20261118.yml
  pull_request:
    paths:
      - data.js
      - images/Sovarka/Starovka/**
      - outils/bancs/banc-starovka-huit-portraits-20261118.cjs
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node outils/bancs/banc-starovka-huit-portraits-20261118.cjs
