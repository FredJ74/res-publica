name: "Krasnov Bar Sever Tabac/Presse — deux WebP et immeuble"
on:
  push:
    branches:
      - chatgpt/krasnov-bar-tabac-immeuble-20261114
    paths:
      - .github/workflows/krasnov-bar-tabac-20261114.yml
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Convertir, supprimer les PNG et vérifier les images
        run: python outils/images/convertir_krasnov_bar_tabac_20261114.py
      - name: Contrôler syntaxe et connexions des trois bâtiments
        run: |
          node --check data.js
          node --check plateau-rue-centrale.js
          node --test outils/bancs/test-krasnov-bar-tabac-immeuble-20261114.mjs
          node --test outils/bancs/test-krasnov-place-ours-appartements-20261114.mjs
      - name: Publier les images et les suppressions
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/Sovarka/Krasnov/
          git diff --cached --check
          git commit -m "assets(krasnov): Bar Sever et Tabac/Presse en WebP, anciens PNG retirés"
          git push origin HEAD:chatgpt/krasnov-bar-tabac-immeuble-20261114
