name: Novomirsk - installer les quatre visuels presidentiels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/novomirsk-presidence-install-20261108.yml'
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir et brancher les quatre pieces sans changer le gameplay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          folder=Path('images/Sovarka/Novomirsk')
          sources={
              'accueil_elysee':folder/'Novomirsk.palais prez.hall.png',
              'appartements_president':folder/'Novomirsk.palais prez.appartements.png',
              'musee_presidentiel':folder/'Novomirsk.palais prez.muse\u0301e.png',
              'salle_reception_presidentielle':folder/'Novomirsk.palais prez.SAM.png',
          }
          expected_bytes={
              'accueil_elysee':2819549,
              'appartements_president':3511895,
              'musee_presidentiel':3485918,
              'salle_reception_presidentielle':3157478,
          }
          targets={room:folder/('novomirsk-palais-presidentiel-'+name+'.webp') for room,name in {
              'accueil_elysee':'hall',
              'appartements_president':'appartements',
              'musee_presidentiel':'musee',
              'salle_reception_presidentielle':'reception',
          }.items()}
          for room,src in sources.items():
              if not src.is_file() or src.stat().st_size!=expected_bytes[room]:
                  raise SystemExit('Source manquante ou differente : '+str(src))
              if targets[room].exists():
                  raise SystemExit('Destination deja existante : '+str(targets[room]))
          data=Path('data.js')
          html=Path('plateau.html')
          original=data.read_text(encoding='utf8')
          section_start=original.index("  soviet: {",original.index("const ROOM_IMAGES_EMPIRE"))
          section_end=original.index("  khalija: {",section_start)
          section=original[section_start:section_end]
          old="""    'palais-presidentiel': {
      'accueil_elysee':    'images/hall-parti-sovarka.webp',
      'bureau_president':  'images/bureau-gouv-sovarka.png'
    },"""
          new="""    'palais-presidentiel': {
      // Images specifiques a Novomirsk : aucune modification des pieces, PNJ ou ordres.
      'accueil_elysee': 'images/Sovarka/Novomirsk/novomirsk-palais-presidentiel-hall.webp',
      'appartements_president': 'images/Sovarka/Novomirsk/novomirsk-palais-presidentiel-appartements.webp',
      'musee_presidentiel': 'images/Sovarka/Novomirsk/novomirsk-palais-presidentiel-musee.webp',
      'salle_reception_presidentielle': 'images/Sovarka/Novomirsk/novomirsk-palais-presidentiel-reception.webp',
      'bureau_president': 'images/bureau-gouv-sovarka.png'
    },"""
          if section.count(old)!=1:
              raise SystemExit('Ancrage des images palais-presidentiel modifie par un autre chantier. Arret sans ecrasement.')
          updated=original[:section_start]+section.replace(old,new)+original[section_end:]
          assert updated.count("novomirsk-palais-presidentiel-hall.webp")==1
          page=html.read_text(encoding='utf8')
          anchor='data.js?v='
          if page.count(anchor)!=1:
              raise SystemExit('Version du catalogue non unique dans plateau.html')
          begin=page.index(anchor)+len(anchor)
          end=page.index('"',begin)
          page=page[:end]+'-presidence-novomirsk-quatre-images-20261108'+page[end:]
          for room,src in sources.items():
              dest=targets[room]
              with Image.open(src) as img:
                  img.load()
                  w,h=img.size
                  if w<1000 or h<600:raise SystemExit('Dimensions suspectes : '+str(src))
                  img.convert('RGB').save(dest,'WEBP',quality=92,method=6)
              with Image.open(dest) as check:
                  if check.format!='WEBP' or check.size!=(w,h):
                      raise SystemExit('WebP incorrect : '+str(dest))
                  check.verify()
              if dest.stat().st_size>=src.stat().st_size:
                  raise SystemExit('Conversion non optimisee : '+str(dest))
              print('CONVERTI',str(src),'->',str(dest),w,h,src.stat().st_size,dest.stat().st_size)
          data.write_text(updated,encoding='utf8')
          html.write_text(page,encoding='utf8')
          for src in sources.values():src.unlink()
          for room,dest in targets.items():
              assert dest.exists() and not sources[room].exists()
              assert str(dest).replace('\\','/') in data.read_text(encoding='utf8')
          print('QUATRE IMAGES CONVERTIES, PNG SUPPRIMES, REFERENCES CODE MISES A JOUR')
          PY
          node --check data.js
          git add -A -- images/Sovarka/Novomirsk data.js plateau.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Novomirsk : quatre salles presidentielles illustrees en WebP'
          git push origin HEAD:main
