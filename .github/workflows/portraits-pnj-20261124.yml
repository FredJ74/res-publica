name: Contrôle portraits PNJ Novomirsk et six guides
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '1 3 * * *'
  push:
    branches:
      - chatgpt/portraits-pnj-20261124
    paths:
      - data.js
      - images/Sovarka/Novomirsk/**
      - outils/audits/portraits/portraits-a-produire-20261124.json
      - outils/bancs/banc-portraits-pnj-20261124.cjs
      - .github/workflows/portraits-pnj-20261124.yml
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
  pull_request:
    paths:
      - data.js
      - images/Sovarka/Novomirsk/**
      - outils/audits/portraits/portraits-a-produire-20261124.json
      - outils/bancs/banc-portraits-pnj-20261124.cjs
      - .github/workflows/portraits-pnj-20261124.yml
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check data.js
      - run: node outils/bancs/banc-portraits-pnj-20261124.cjs
