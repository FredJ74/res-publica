name: Novomirsk - regenerer scenes PNJ temporaire
on:
  pull_request:
    paths:
      - .github/workflows/novomirsk-scenes-pnj-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/novomirsk-pnj-scenes-20261106
          persist-credentials: true
      - name: Regenerer via le generateur canonique existant
        run: |
          node outils/generateurs/generer-pnj-lieux-metiers.cjs --scenes-js > api/_pnj-scenes-generes.js
          node --check api/_pnj-scenes-generes.js
          node --test outils/bancs/banc-pnj-localisation-psm.mjs
          git diff --check
      - name: Publier le catalogue de scenes conforme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/_pnj-scenes-generes.js
          git diff --cached --stat
          git commit -m "fix(pnj): synchroniser les scenes des deux agents du centre Novomirsk"
          git fetch origin chatgpt/novomirsk-pnj-scenes-20261106
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/chatgpt/novomirsk-pnj-scenes-20261106
