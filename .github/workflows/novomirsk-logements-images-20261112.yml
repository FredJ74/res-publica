name: "Novomirsk V16 — convertir et raccorder les six images"
on:
  push:
    branches:
      - chatgpt/novomirsk-logements-images-20261112
    paths:
      - .github/workflows/novomirsk-logements-images-20261112.yml
permissions:
  contents: write
jobs:
  implantation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow
      - name: Convertir les PNG et raccorder data.js
        run: python outils/images/implanter-logements-v16-20261112.py
      - name: Vérifier les références des 18 pièces et la navigation
        run: |
          node --check data.js
          node --test outils/bancs/test-logements-marche-novomirsk-20261112.mjs
          node - <<'NODE'
          const fs = require('node:fs'), vm = require('node:vm'), assert = require('node:assert/strict');
          const ctx = {console}; ctx.window = ctx; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8')+';this.B=BUILDINGS;',ctx);
          for (const [suffix,nom] of [['marche','Marché'],['quais','Quais']]) {
            const b = ctx.B['logements-novomirsk-'+suffix];
            assert.ok(b,nom);
            const rooms = Object.entries(b.rooms);
            assert.equal(rooms.length,9,nom);
            for (const [piece,r] of rooms) {
              const f = r.imageUrl;
              assert.ok(f && fs.existsSync(f),nom+' : '+piece+' => '+f);
              assert.ok(fs.readFileSync(f).subarray(0,4).equals(Buffer.from('RIFF')),f);
            }
            assert.equal(b.rooms.petit_appartement_1.locationData.prix,10);
            assert.equal(b.rooms.grand_appartement_1.locationData.prix,20);
          }
          console.log('Images : 18/18 pièces reliées aux six WebP.');
          NODE
      - name: Committer les images WebP et le raccordement
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Novomirsk/
          git diff --cached --check
          git commit -m "Novomirsk V16 : six WebP, halls et appartements des deux immeubles"
          git push origin HEAD:chatgpt/novomirsk-logements-images-20261112
