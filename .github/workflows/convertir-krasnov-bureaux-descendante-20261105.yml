name: Convertir Krasnov bureaux et rue descendante
on:
  push:
    branches: [main]
    paths:
      - 'outils/images/convertir_krasnov_bureaux_descendante_20261105.py'
      - '.github/workflows/convertir-krasnov-bureaux-descendante-20261105.yml'
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow==11.3.0
      - name: Convertir, valider puis supprimer les PNG
        run: python outils/images/convertir_krasnov_bureaux_descendante_20261105.py
      - name: Contrôler les images livrées et nettoyer le dossier
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          directory=Path('images/Sovarka/Krasnov')
          assert not list(directory.glob('*.png'))
          for name in ('Krasnov_rue_bureaux.webp','Krasnov_rue_descendante.webp'):
              with Image.open(directory/name) as im:
                  assert im.format == 'WEBP'
                  im.verify()
          print('Vérification complète : 2 WebP et 0 PNG')
          PY
          git diff --check
      - name: Commit des images uniquement
        run: |
          git add -A -- images/Sovarka/Krasnov
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(krasnov): convertir bureaux et rue descendante en WebP'
          git push origin HEAD:main
