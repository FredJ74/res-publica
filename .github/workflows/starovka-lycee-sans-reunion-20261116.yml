name: "Starovka — lycée sans salle de réunion"
on:
  # Tous les contrôles tournent chaque nuit sur main (mission de nuit du 27/11/2026).
  schedule:
    - cron: '38 3 * * *'
  push:
    branches: [chatgpt/starovka-lycee-retirer-reunion-goulag-spec-20261116]
    paths:
      - .github/workflows/starovka-lycee-sans-reunion-20261116.yml
      - data.js
      - outils/bancs/test-starovka-lycee-sans-reunion-20261116.cjs
      - 'plateau-core.js'
      - 'plateau-router.js'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'i18n/**'
      - 'auth.js'
      - 'supabase.js'
      - 'sens-saisie.js'
      - 'style.css'
      - 'rue-centrale.css'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier syntaxe, pièces lycée, isolation
        run: |
          node --check data.js
          node outils/bancs/test-starovka-lycee-sans-reunion-20261116.cjs
          node outils/bancs/test-starovka-commissariat-lycee-20261116.cjs
