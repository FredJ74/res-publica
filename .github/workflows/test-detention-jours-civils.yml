name: Tests détention calendrier universel
on:
  pull_request:
    paths:
      - 'api/cron-minuit.js'
      - 'plateau-justice-economie.js'
      - 'migrations/20261031113547_detention_jours_civils_universels.sql'
      - 'outils/bancs/test-detention-jours-civils.mjs'
      - '.github/workflows/test-detention-jours-civils.yml'
  push:
    branches:
      - 'correctif/detention-jours-civils-20261017'
# Annuler seulement les executions perimees d'une meme PR ; main reste integral.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test outils/bancs/test-detention-jours-civils.mjs
