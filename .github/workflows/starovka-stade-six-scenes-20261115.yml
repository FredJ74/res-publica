name: "Starovka : six scènes WebP du stade"
on:
  push:
    branches: [chatgpt/starovka-stade-six-scenes-20261115]
    paths:
      - .github/workflows/starovka-stade-six-scenes-20261115.yml
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Convertir PNG, valider puis supprimer les originaux
        run: python outils/images/implanter_starovka_stade_20261115.py
      - name: Vérifier l'isolation des scènes et les commandes
        run: |
          node --check data.js
          node outils/bancs/test-starovka-stade-six-scenes-20261115.cjs
      - name: Committer les WebP et les nouveaux raccordements
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Starovka/
          git diff --cached --check
          git commit -m "Starovka : six décors WebP du stade, boutique des supporters distincte"
          git push origin HEAD:chatgpt/starovka-stade-six-scenes-20261115
