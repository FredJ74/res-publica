name: Novomirsk — quatre visuels du centre artisanal WebP
on:
  push:
    branches: [chatgpt/novomirsk-artisanal-quatre-webp-20261110]
    paths:
      - '.github/workflows/novomirsk-artisanal-quatre-webp-20261110.yml'
      - 'data.js'
      - 'plateau.html'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Verifier les sources, convertir et confirmer les WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          from PIL import Image, ImageOps
          root = Path('images/Sovarka/Novomirsk')
          source_sha = {
              'Novomirsk_centre artisanal_accueil': 'bf213ac64a29cadd1c703a497302e89402fa2c54',
              'Novomirsk_centre artisanal_grand atelier': '124fe5c171b92a621b7cae9fbcb32ef82183d067',
              'Novomirsk_centre artisanal_moyen local': '3ac63fabc5dcfe24c78732079f691e7d394c819d',
              'Novomirsk_centre artisanal_petit local': 'a711080fc1aef44dfcd40c9afa5c52936ef2e7d0'
          }
          for stem, expected in source_sha.items():
              source = root / (stem + '.png')
              target = root / (stem + '.webp')
              assert source.is_file(), f'Original absent: {source}'
              assert not target.exists(), f'WebP deja existant: {target}'
              actual = subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip()
              assert actual == expected, f'PNG inattendu: {source} / {actual}'
              with Image.open(source) as image:
                  original = ImageOps.exif_transpose(image).convert('RGB')
                  size = original.size
                  original.save(target, format='WEBP', quality=85, method=6)
              with Image.open(target) as webp:
                  assert webp.format == 'WEBP' and webp.size == size
                  webp.load()
              assert target.stat().st_size > 100000, f'WebP anormal: {target}'
              print(stem, size, source.stat().st_size, '->', target.stat().st_size)
          # Les quatre fichiers ont ete controles AVANT toute suppression.
          for stem in source_sha:
              (root / (stem + '.png')).unlink()
              assert (root / (stem + '.webp')).is_file()
          print('4 conversions validees et 4 PNG retires')
          PY
      - name: Verifier les references graphiques du jeu et l'isolation
        run: |
          node --check data.js
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const ctx = vm.createContext({});
          vm.runInContext(fs.readFileSync('data.js', 'utf8'), ctx);
          const snapshot = vm.runInContext("({soviet:WORLD.soviet.capitale.buildingContext['centre-artisanal'], republic:WORLD.republic.capitale.buildingContext['centre-artisanal']})", ctx);
          const rooms = {
            travees:'accueil', echoppe_facade:'grand atelier', atelier_milieu:'moyen local', reserve_arriere:'petit local'
          };
          for (const [room,stem] of Object.entries(rooms)) {
             const path = 'images/Sovarka/Novomirsk/Novomirsk_centre artisanal_' + stem + '.webp';
             assert.equal(snapshot.soviet.roomOverrides[room].imageUrl, path);
             assert.equal(fs.existsSync(path), true, path);
             assert.equal(fs.existsSync(path.replace(/\.webp$/, '.png')), false, path);
             const bytes = fs.readFileSync(path);
             assert.equal(bytes.toString('ascii', 0, 4), 'RIFF');
             assert.equal(bytes.toString('ascii', 8, 12), 'WEBP');
          }
          assert.notEqual(snapshot.republic?.roomOverrides?.travees?.imageUrl, snapshot.soviet.roomOverrides.travees.imageUrl);
          const html = fs.readFileSync('plateau.html','utf8');
          assert.match(html,/data\.js\?v=[^"]*artisanal-novomirsk-20261110/);
          console.log('Novomirsk centre artisanal : 4 chemins exacts, 4 WEBP, Republia inchangee');
          NODE
      - name: Pousser uniquement les 4 WebP et les suppressions
        run: |
          git add -A -- images/Sovarka/Novomirsk/
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(novomirsk): quatre visuels centre artisanal convertis en WebP'
          git push origin HEAD:chatgpt/novomirsk-artisanal-quatre-webp-20261110
