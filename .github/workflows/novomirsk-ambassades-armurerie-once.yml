name: Novomirsk — 5 décors ambassades et armurerie (exécution unique)
# Relance de recette via pull_request sans déploiement anticipé.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/novomirsk-ambassades-armurerie-once.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/novomirsk-ambassades-armurerie-once.yml']
permissions:
  contents: write
jobs:
  integrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Convertir cinq PNG, raccorder exactement les salles, contrôler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root=Path('images/Sovarka/Novomirsk')
          fichiers={
            'Novomirsk_armurerie.png':'Novomirsk_armurerie.webp',
            'Novomirsk_Palais des Ambassades_hall.png':'Novomirsk_Palais des Ambassades_hall.webp',
            'Novomirsk_amabassades_Republia.png':'Novomirsk_amabassades_Republia.webp',
            'Novomirsk_ambassades_Al Khalija.png':'Novomirsk_ambassades_Al Khalija.webp',
            'Novomirsk_ambassades_El Estado.png':'Novomirsk_ambassades_El Estado.webp',
          }
          for source_name, target_name in fichiers.items():
            source=root/source_name
            target=root/target_name
            assert source.is_file(), f'PNG manquant : {source}'
            assert not target.exists(), f'WebP déjà présent, arrêt avant écrasement : {target}'
            with Image.open(source) as image:
              assert image.width>=1000 and image.height>=700, f'Image anormale : {source}'
              image.convert('RGB').save(target,'WEBP',quality=86,method=6)
              dimensions=image.size
            with Image.open(target) as image:
              assert image.format=='WEBP' and image.size==dimensions, f'Conversion invalide : {target}'
            assert target.stat().st_size>10000, f'Conversion trop petite : {target}'
            print(f'{source} => {target} : {target.stat().st_size} octets')

          fichier=Path('data.js')
          text=fichier.read_text(encoding='utf8')
          debut=text.index("  'palais-ambassades-novomirsk': {")
          fin=text.index("  'pavillon-ambassadeurs-novomirsk': {",debut)
          morceau=text[debut:fin]
          mapping={
            'accueil_ambassades_novomirsk':'Novomirsk_Palais des Ambassades_hall.webp',
            'bureau_republia_novomirsk':'Novomirsk_amabassades_Republia.webp',
            'bureau_khalija_novomirsk':'Novomirsk_ambassades_Al Khalija.webp',
            'bureau_estado_novomirsk':'Novomirsk_ambassades_El Estado.webp'
          }
          for room,image in mapping.items():
            pattern=r'(      '+re.escape(room)+r': \{\n        name: [^\n]+\n        imageBg: [^\n]+\n)'
            # Compilé séparément pour garantir que le remplacement ne cible que la salle demandée.
            regex=re.compile(pattern)
            found=list(regex.finditer(morceau))
            assert len(found)==1, f'Définition unique introuvable : {room}: {len(found)}'
            url='images/Sovarka/Novomirsk/'+image
            morceau=regex.sub(lambda match: match.group(1)+'        imageUrl: "'+url+'",\n',morceau,count=1)
            assert morceau.count('imageUrl: "'+url+'"')==1,room

          text=text[:debut]+morceau+text[fin:]
          ancien="""          name: 'Arsenal Collectif',
          desc: "Les armes appartiennent au Peuple. Accès sur autorisation du Parti.",
"""
          nouveau=ancien+"""          roomOverrides: {
            magasin: { imageUrl: "images/Sovarka/Novomirsk/Novomirsk_armurerie.webp" }
          },
"""
          assert text.count(ancien)==1, "Armurerie sovarkienne non identifiée sans ambiguïté"
          text=text.replace(ancien,nouveau,1)
          assert text.count('Novomirsk_armurerie.webp')==1, 'Image de l’armurerie doit rester propre à Sovarka'
          for name in fichiers:
            (root/name).unlink()
          fichier.write_text(text,encoding='utf8')
          Path('.github/workflows/novomirsk-ambassades-armurerie-once.yml').unlink()
          print('5 images WebP vérifiées, 5 PNG supprimés, 4 pièces ambassades + armurerie raccordées')
          PY
          node --check data.js
          node --test outils/bancs/banc-ambassades-bientot-20261101.cjs
          python - <<'PY'
          from pathlib import Path
          root=Path('images/Sovarka/Novomirsk')
          for stem in ('Novomirsk_armurerie','Novomirsk_Palais des Ambassades_hall',
                      'Novomirsk_amabassades_Republia','Novomirsk_ambassades_Al Khalija',
                      'Novomirsk_ambassades_El Estado'):
            assert not (root/(stem+'.png')).exists(), stem
            assert (root/(stem+'.webp')).is_file(), stem
          print('Contrôles images terminés')
          PY
      - name: Commit, push sans écraser le travail concurrent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/Sovarka/Novomirsk .github/workflows/novomirsk-ambassades-armurerie-once.yml
          git diff --cached --stat
          git commit -m "Novomirsk : cinq décors WebP armurerie et ambassades intégrés"
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
