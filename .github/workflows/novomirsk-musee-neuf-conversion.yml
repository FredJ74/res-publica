name: Novomirsk — convertir les neuf images du musée en WebP
on:
  push:
    branches: [chatgpt/novomirsk-musee-national-neuf-webp-20261110]
    paths:
      - '.github/workflows/novomirsk-musee-neuf-conversion.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Vérifier les empreintes, convertir puis supprimer les PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import subprocess
          root = Path('images/Sovarka/Novomirsk')
          prefix = 'Novomirsk_musée national_'
          fichiers = {
              'accueil': '3a8f0eba1dbb0d625e6b0c3c0eb834ce27245c3e',
              'salle artistes': 'e56edbac23016ea24d6b219ca9968a372af6de3e',
              'salle crises': 'eee55eca99301ca12dc6e0f4cca2cdb7393a1cd9',
              'salle des honneurs militaires': '0a563258a60990fccd925873bc2774658dba0a2b',
              'salle expo tournantes': '6cc6e296d17d0df48d3befc5f354b5dacf49ec61',
              'salle partis': '271edaee863cf78cc9a7015e0f8735580f2c5ab6',
              'salle présidents': 'dd2a6c220a97ade7b56f49f2a9d8493892f40e33',
              'salle sportifs': '8be07bb835a75d09081111ceb61d3f5e4f7e99e1',
              'salle tractorisme': '9258a353feb2353ed6e986a410aff02ba3361b98',
          }
          assert len(fichiers) == 9
          for suffixe, sha in fichiers.items():
              original = root / (prefix + suffixe + '.png')
              webp = root / (prefix + suffixe + '.webp')
              assert original.is_file() and not webp.exists(), original
              assert subprocess.check_output(['git', 'hash-object', str(original)], text=True).strip() == sha, original
              with Image.open(original) as img:
                  converted = ImageOps.exif_transpose(img).convert('RGB')
                  size = converted.size
                  converted.save(webp, 'WEBP', quality=85, method=6)
              with Image.open(webp) as img:
                  assert img.format == 'WEBP' and img.size == size
                  img.verify()
              with Image.open(webp) as img:
                  img.load()
              assert webp.stat().st_size > 100000
              print(original.name, '->', webp.name, size, webp.stat().st_size)
          # Ne rien supprimer avant d'avoir validé tous les neuf WebP.
          for suffixe in fichiers:
              original = root / (prefix + suffixe + '.png')
              webp = root / (prefix + suffixe + '.webp')
              original.unlink()
              assert not original.exists() and webp.exists()
          print('9/9 WebP validés, 9 PNG supprimés')
          PY
      - name: Vérifier la syntaxe du catalogue et préparer la livraison
        run: |
          node --check data.js
          git add -A -- images/Sovarka/Novomirsk/
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(sovarka): neuf images du musée national en WebP'
          git push origin HEAD:chatgpt/novomirsk-musee-national-neuf-webp-20261110
