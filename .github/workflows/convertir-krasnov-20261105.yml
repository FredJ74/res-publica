name: Convertir les cinq PNG de Krasnov
on:
  push:
    branches: [main]
    paths:
      - 'outils/images/convertir_krasnov_20261105.py'
      - '.github/workflows/convertir-krasnov-20261105.yml'
permissions:
  contents: write
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow==11.3.0
      - name: Convertir et supprimer uniquement les cinq originaux validés
        run: python outils/images/convertir_krasnov_20261105.py
      - name: Contrôles finaux
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('images/Sovarka/Krasnov')
          names=['Krasnov rue église.webp','Krasnov rue gare.webp','Krasnov rue maison.webp','Krasnov rue terrains.webp','Krasnov_gare_hall.webp']
          assert not list(p.glob('*.png')), 'PNG résiduel'
          for name in names:
              assert (p/name).is_file(),name
              with Image.open(p/name) as image:
                  assert image.format=='WEBP', name
                  image.verify()
          print('5/5 images WebP valides ; 0 PNG restant')
          PY
          git diff --check
      - name: Commit et publication
        run: |
          git add -A -- images/Sovarka/Krasnov
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(krasnov): cinq images converties en WebP, PNG supprimés"
          git push origin HEAD:main
