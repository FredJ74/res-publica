name: "Krasnov : identifier les planches candidates"
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "outils/images/identifier_planche_krasnov_20261117.py"
      - ".github/workflows/krasnov-identifier-portraits-20261117.yml"
jobs:
  apercus:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - name: Dimensions, plans et apercus compacts
        run: python outils/images/identifier_planche_krasnov_20261117.py
      - name: Publier les apercus de controle sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/images/.krasnov-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Krasnov: apercus legers des deux planches pour controle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
