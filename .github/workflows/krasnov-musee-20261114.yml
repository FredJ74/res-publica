name: "Krasnov musée — six images, portraits et salles"
on:
  push:
    branches:
      - chatgpt/krasnov-musee-six-images-20261114
    paths:
      - .github/workflows/krasnov-musee-20261114.yml
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install pillow
      - name: Six images PNG et portraits vers WebP
        run: python outils/images/convertir_krasnov_musee_20261114.py
      - name: Vérifier les pièces et la navigation existante
        run: |
          node --check data.js
          node --test outils/bancs/test-krasnov-musee-20261114.mjs
          node --test outils/bancs/test-krasnov-place-ours-appartements-20261114.mjs
      - name: Committer les WebP et suppressions
        run: |
          git config user.name "ChatGPT (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/Sovarka/Krasnov/
          git diff --cached --check
          git commit -m "assets(krasnov): musée en six WebP et deux portraits de scène"
          git push origin HEAD:chatgpt/krasnov-musee-six-images-20261114
